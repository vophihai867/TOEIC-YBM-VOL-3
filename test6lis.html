    ["How can I help out with the organization's fundraising event?","Tôi có thể giúp gì cho sự kiện gây quỹ của tổ chức?"],
    ["(A) I'm just glad I could participate.","(A) Tôi chỉ vui vì mình đã có thể tham gia."],
    ["(B) We raised more than expected.","(B) Chúng ta đã quyên góp được nhiều hơn dự kiến."],
    ["(C) Wendy can give you some tasks.","(C) Wendy có thể giao cho bạn một số nhiệm vụ."]]},
  {part:"Part 2",title:"Question 31",start:758.2,end:773.4,rows:[
    ["Did you remember to ask Hiroto to clean the air conditioner?","Bạn có nhớ nhờ Hiroto vệ sinh máy điều hòa không?"],
    ["(A) Don't forget the ceiling fans.","(A) Đừng quên các quạt trần."],
    ["(B) I haven't seen him since yesterday.","(B) Tôi đã không gặp anh ấy kể từ hôm qua."],
    ["(C) It is a bit cold in here.","(C) Ở đây hơi lạnh."]]},
  {part:"Part 3",title:"Part 3 Directions",start:778.4,end:805,rows:[
    ["You will hear some conversations between two or more people.","Bạn sẽ nghe một số cuộc hội thoại giữa hai người trở lên."],
    ["You will be asked to answer three questions about what the speakers say in each conversation.","Bạn sẽ được yêu cầu trả lời ba câu hỏi về những gì các nhân vật nói trong mỗi cuộc hội thoại."],
    ["Select the best response to each question and mark the letter (A), (B), (C), or (D) on your answer sheet.","Hãy chọn đáp án phù hợp nhất cho mỗi câu hỏi rồi tô chữ cái (A), (B), (C) hoặc (D) trên phiếu trả lời."]]},
  {part:"Part 3",title:"Questions 32–34",start:805,end:881.2,rows:[
    ["Woman: Hello, I made a reservation to hire a Montoya sedan from your company.","Nữ: Xin chào, tôi đã đặt thuê một chiếc sedan Montoya của công ty anh."],
    ["Here's the confirmation email you sent me.","Đây là thư điện tử xác nhận mà anh đã gửi cho tôi."],
    ["Man: Thank you. Okay, I see that you'll have the vehicle for two days.","Nam: Cảm ơn cô. Được rồi, tôi thấy rằng cô sẽ sử dụng chiếc xe trong hai ngày."],
    ["Here are the keys. Do you have any questions?","Chìa khóa của cô đây. Cô có câu hỏi nào không?"],
    ["Woman: Yes, is the satellite navigation system complicated?","Nữ: Có, hệ thống định vị vệ tinh có phức tạp không?"],
    ["I've never used one before, so I'm a bit worried about whether I'll be able to figure it out.","Trước đây tôi chưa bao giờ dùng hệ thống như vậy, nên tôi hơi lo không biết mình có thể hiểu cách sử dụng nó hay không."],
    ["Man: It's fairly simple, but also there's a user manual in the glove compartment.","Nam: Nó khá đơn giản, ngoài ra còn có sách hướng dẫn sử dụng trong ngăn đựng đồ phía trước."],
    ["Woman: Oh great, I'll take a look at that before I set off.","Nữ: Ồ, tuyệt quá, tôi sẽ xem qua sách đó trước khi khởi hành."],
    ["32. Where are the speakers?","32. Các nhân vật đang ở đâu?"],
    ["33. What problem does the woman mention?","33. Người phụ nữ đề cập đến vấn đề gì?"],
    ["34. What does the woman say she will do?","34. Người phụ nữ nói rằng cô ấy sẽ làm gì?"]]},
  {part:"Part 3",title:"Questions 35–37",start:881.2,end:957.4,rows:[
    ["Woman: Excuse me, Norman, I'd like to speak with you about something after you receive the delivery today.","Nữ: Xin lỗi, Norman, tôi muốn trao đổi với anh về một việc sau khi anh nhận hàng giao tới hôm nay."],
    ["Man: Oh, the delivery was this morning.","Nam: Ồ, hàng đã được giao vào sáng nay rồi."],
    ["Woman: Ah, great! Well, the CEO wants to add a few more healthy dishes to our catering options.","Nữ: À, tuyệt quá! Tổng giám đốc muốn bổ sung thêm một vài món ăn lành mạnh vào các lựa chọn phục vụ ăn uống của chúng ta."],
    ["What do you think about developing some soups?","Anh nghĩ sao về việc phát triển thêm một số món súp?"],
    ["Man: Mmm, I don't know. We'd have to invest in special containers to transport them.","Nam: Ừm, tôi không biết nữa. Chúng ta sẽ phải đầu tư vào các hộp đựng chuyên dụng để vận chuyển chúng."],
    ["That might be costly.","Việc đó có thể tốn kém."],
    ["Woman: Good point. But I don't want to give up on this idea yet.","Nữ: Ý kiến hay đấy. Nhưng tôi vẫn chưa muốn từ bỏ ý tưởng này."],
    ["I'm going to get on the internet and see what kinds of containers are available.","Tôi sẽ lên mạng xem có những loại hộp đựng nào đang được bán."],
    ["35. What does the man mean when he says, “The delivery was this morning”?","35. Người đàn ông có ý gì khi nói: ‘Hàng đã được giao vào sáng nay rồi’?"],
    ["36. According to the woman, what does the CEO want to do?","36. Theo người phụ nữ, tổng giám đốc muốn làm gì?"],
    ["37. What does the woman decide to do?","37. Người phụ nữ quyết định làm gì?"]]},
  {part:"Part 3",title:"Questions 38–40",start:957.4,end:1028.9,rows:[
    ["Woman: Hi, this is Kathy in the IT department. How can I help you?","Nữ: Xin chào, tôi là Kathy ở bộ phận công nghệ thông tin. Tôi có thể giúp gì cho anh?"],
    ["Man: Hi Kathy, I just started working here in the marketing department, and I'm having trouble logging into my work computer.","Nam: Chào Kathy, tôi vừa bắt đầu làm việc ở đây trong bộ phận tiếp thị và tôi đang gặp khó khăn khi đăng nhập vào máy tính làm việc."],
    ["Woman: I see. Are you using the username and password you were assigned at the orientation?","Nữ: Tôi hiểu rồi. Anh có đang sử dụng tên đăng nhập và mật khẩu được cấp trong buổi định hướng không?"],
    ["Man: Yes, and I double-checked those with HR, but whenever I enter them, the computer just freezes and then shuts down.","Nam: Có, và tôi đã kiểm tra lại những thông tin đó với bộ phận Nhân sự, nhưng cứ mỗi khi tôi nhập chúng thì máy tính lại bị treo rồi tắt."],
    ["Woman: That's strange. I'll send an employee up to take a look at it.","Nữ: Lạ thật. Tôi sẽ cử một nhân viên lên kiểm tra máy."],
    ["He'll be there in a few minutes.","Anh ấy sẽ có mặt ở đó trong vài phút nữa."],
    ["38. Who most likely is the woman?","38. Người phụ nữ có khả năng là ai nhất?"],
    ["39. What problem does the man have?","39. Người đàn ông gặp vấn đề gì?"],
    ["40. What will the woman probably do next?","40. Người phụ nữ có thể sẽ làm gì tiếp theo?"]]},
  {part:"Part 3",title:"Questions 41–43",start:1028.9,end:1104,rows:[
    ["Woman: Hi Terry, I haven't seen you since you started fixing cars at Sheldon Auto.","Nữ: Chào Terry, tôi chưa gặp anh kể từ khi anh bắt đầu sửa ô tô tại Sheldon Auto."],
    ["Are you enjoying the job so far?","Cho đến giờ anh có thích công việc đó không?"],
    ["Man: It could be better. I get along well with my coworkers, but I'm getting tired of the 55-minute bus ride to work every day.","Nam: Công việc có thể tốt hơn. Tôi hòa hợp với đồng nghiệp, nhưng tôi đang dần chán ngán chuyến xe buýt 55 phút đến chỗ làm mỗi ngày."],
    ["Woman: That does sound frustrating.","Nữ: Điều đó đúng là nghe có vẻ bực bội."],
    ["Well, I'm planning to go to a career fair at the community center this Saturday at 2:00.","Tôi đang định đến một hội chợ việc làm tại trung tâm cộng đồng lúc 2 giờ chiều thứ Bảy này."],
    ["Why don't you come with me? You might find a job that suits you better.","Sao anh không đi cùng tôi? Có thể anh sẽ tìm được một công việc phù hợp với mình hơn."],
    ["Man: That's not a bad idea at all. Would you like to get lunch first?","Nam: Ý đó không tệ chút nào. Cô có muốn ăn trưa trước không?"],
    ["I could pick you up at noon.","Tôi có thể đón cô vào buổi trưa."],
    ["41. What most likely is the man's job?","41. Công việc của người đàn ông có khả năng là gì nhất?"],
    ["42. What does the man say he dislikes about his job?","42. Người đàn ông nói rằng anh ấy không thích điều gì về công việc của mình?"],
    ["43. What does the woman suggest that the man do?","43. Người phụ nữ đề nghị người đàn ông làm gì?"]]},
  {part:"Part 3",title:"Questions 44–46",start:1110.6,end:1189.3,rows:[
    ["Man 1 (James): Hi Olivia, thanks for inviting us to your new home for this consultation.","Nam 1 (James): Chào Olivia, cảm ơn cô đã mời chúng tôi đến ngôi nhà mới của cô để tư vấn."],
    ["I'm James, and I'll be handling the decoration and arrangement of your living room and bedrooms.","Tôi là James và tôi sẽ phụ trách việc trang trí và sắp xếp phòng khách cùng các phòng ngủ của cô."],
    ["This is my colleague, Joe.","Đây là đồng nghiệp của tôi, Joe."],
    ["Man 2 (Joe): Hi, I'll be taking care of your bathrooms and kitchen.","Nam 2 (Joe): Xin chào, tôi sẽ phụ trách các phòng tắm và nhà bếp của cô."],
    ["Woman (Olivia): It's a pleasure to meet the two of you.","Nữ (Olivia): Rất vui được gặp hai anh."],
    ["As you can see, I don't even have any furniture, so you'll really have a lot to do!","Như các anh có thể thấy, tôi thậm chí còn chưa có món đồ nội thất nào, vì vậy các anh thực sự sẽ có rất nhiều việc phải làm!"],
    ["Man 2 (Joe): Well, we love a challenge. Now, why don't you show us around?","Nam 2 (Joe): Chúng tôi thích thử thách mà. Giờ cô dẫn chúng tôi đi xem quanh nhà nhé?"],
    ["That way we can get some ideas for how to begin.","Bằng cách đó, chúng tôi có thể nảy ra một số ý tưởng về cách bắt đầu."],
    ["Woman (Olivia): Sure. Let's start with the upstairs rooms and work our way down.","Nữ (Olivia): Được. Chúng ta hãy bắt đầu với các phòng ở tầng trên rồi lần lượt đi xuống."],
    ["Man 1 (James): Sounds good.","Nam 1 (James): Nghe hay đấy."],
    ["44. Who most likely are the men?","44. Những người đàn ông có khả năng là ai nhất?"],
    ["45. What does the woman mention about the property?","45. Người phụ nữ đề cập điều gì về căn nhà?"],
    ["46. What will the men probably do next?","46. Những người đàn ông có thể sẽ làm gì tiếp theo?"]]},
  {part:"Part 3",title:"Questions 47–49",start:1189.3,end:1266.7,rows:[
    ["Woman: Peter, I just saw your email. I'm sorry, but I won't be able to write that report by Friday.","Nữ: Peter, tôi vừa xem thư điện tử của anh. Tôi xin lỗi, nhưng tôi sẽ không thể viết xong báo cáo đó trước thứ Sáu."],
    ["I have too many other tasks to take care of.","Tôi còn quá nhiều nhiệm vụ khác phải xử lý."],
    ["Man (Peter): Well, I really need that report this week.","Nam (Peter): Tôi thực sự cần báo cáo đó trong tuần này."],
    ["Could any of your other work be redistributed to your coworkers?","Có công việc nào khác của cô có thể được phân bổ lại cho đồng nghiệp không?"],
    ["Woman: Mmm, Angelina could add the new client details to the database.","Nữ: Ừm, Angelina có thể thêm thông tin chi tiết của khách hàng mới vào cơ sở dữ liệu."],
    ["She's done that before when I've gone on vacation.","Trước đây cô ấy đã từng làm việc đó khi tôi đi nghỉ."],
    ["Man (Peter): Okay, let me check her schedule for the week.","Nam (Peter): Được, để tôi kiểm tra lịch của cô ấy trong tuần."],
    ["If she's not too busy, I'll ask her to handle that.","Nếu cô ấy không quá bận, tôi sẽ nhờ cô ấy xử lý việc đó."],
    ["Will that give you enough time to write the report?","Như vậy có cho cô đủ thời gian để viết báo cáo không?"],
    ["Woman: Yes, I think it would.","Nữ: Có, tôi nghĩ là đủ."],
    ["47. Why does the woman say she is unable to accept an assignment?","47. Tại sao người phụ nữ nói rằng cô ấy không thể nhận một nhiệm vụ?"],
    ["48. What does the woman suggest asking Angelina to do?","48. Người phụ nữ đề nghị nhờ Angelina làm gì?"],
    ["49. What does the man say he will check?","49. Người đàn ông nói rằng anh ấy sẽ kiểm tra điều gì?"]]},
  {part:"Part 3",title:"Questions 50–52",start:1266.7,end:1345.7,rows:[
    ["Man (Scott): Hi, this is Scott Rubin. I ordered some posters from your store earlier this week.","Nam (Scott): Xin chào, tôi là Scott Rubin. Tôi đã đặt một số áp phích từ cửa hàng của cô vào đầu tuần này."],
    ["I'm looking at the sample you sent me, and I don't think my company's logo is visible enough.","Tôi đang xem mẫu mà cô gửi và tôi thấy biểu trưng của công ty mình chưa đủ rõ."],
    ["Maybe dark blue wasn't a good choice for it.","Có lẽ màu xanh đậm không phải là lựa chọn phù hợp cho biểu trưng."],
    ["Woman: Okay, we can make it a lighter shade of blue.","Nữ: Được, chúng tôi có thể đổi nó sang một sắc xanh nhạt hơn."],
    ["I'll have my assistant do that this morning, and she'll email you the revised sample this afternoon.","Tôi sẽ nhờ trợ lý làm việc đó vào sáng nay và chiều nay cô ấy sẽ gửi mẫu đã chỉnh sửa cho anh qua thư điện tử."],
    ["And since it's a minor change, there won't be any additional cost.","Và vì đây là một thay đổi nhỏ nên sẽ không có thêm chi phí nào."],
    ["Man (Scott): Great! Oh, and one other thing, regarding the scheduled pickup time tomorrow: can we make it 1:00 PM instead of 11:00 AM?","Nam (Scott): Tuyệt! Ồ, còn một việc nữa liên quan đến giờ nhận hàng đã lên lịch vào ngày mai: chúng ta có thể đổi thành 1 giờ chiều thay vì 11 giờ sáng không?"],
    ["I have an early business lunch.","Tôi có một bữa trưa công việc sớm."],
    ["50. What is the man concerned about?","50. Người đàn ông lo ngại về điều gì?"],
    ["51. What does the woman say her assistant will do this afternoon?","51. Người phụ nữ nói rằng trợ lý của cô ấy sẽ làm gì vào chiều nay?"],
    ["52. Why does the man want to change an appointment time?","52. Tại sao người đàn ông muốn thay đổi giờ hẹn?"]]},
  {part:"Part 3",title:"Questions 53–55",start:1345.7,end:1424.7,rows:[
    ["Man: Rachel, you know how our guests sometimes ask if we offer neighborhood tours?","Nam: Rachel, cô biết việc khách của chúng ta thỉnh thoảng hỏi liệu chúng ta có tổ chức chuyến tham quan khu phố không chứ?"],
    ["I'd like to try doing that. I think it would make their stay with us more memorable.","Tôi muốn thử làm việc đó. Tôi nghĩ nó sẽ khiến kỳ nghỉ của họ tại chỗ chúng ta đáng nhớ hơn."],
    ["Woman (Rachel): That's a great idea! So many fascinating events have happened around here.","Nữ (Rachel): Đó là một ý tưởng tuyệt vời! Rất nhiều sự kiện thú vị đã xảy ra quanh đây."],
    ["There would be a lot to talk about.","Sẽ có rất nhiều điều để giới thiệu."],
    ["Man: Exactly. So do you think any of our workers could lead a tour, or should we try to find a professional tour guide?","Nam: Chính xác. Vậy cô nghĩ nhân viên nào của chúng ta có thể dẫn một chuyến tham quan, hay chúng ta nên tìm một hướng dẫn viên du lịch chuyên nghiệp?"],
    ["Woman (Rachel): Mmm, well, Michael knows the area pretty well, and he's very outgoing.","Nữ (Rachel): Ừm, Michael hiểu khu vực này khá rõ và anh ấy rất cởi mở, hòa đồng."],
    ["Why don't you mention the idea to him when he comes in for his shift?","Sao anh không đề cập ý tưởng này với anh ấy khi anh ấy đến làm ca của mình?"],
    ["53. What type of business do the speakers most likely work for?","53. Các nhân vật có khả năng làm việc cho loại hình doanh nghiệp nào nhất?"],
    ["54. What does the woman mention about the surrounding neighborhood?","54. Người phụ nữ đề cập điều gì về khu vực lân cận?"],
    ["55. What does the woman imply when she says, “Michael knows the area pretty well”?","55. Người phụ nữ ngụ ý điều gì khi nói: ‘Michael hiểu khu vực này khá rõ’?"]]},
  {part:"Part 3",title:"Questions 56–58",start:1424.7,end:1508.6,rows:[
    ["Woman 1 (Harumi): Mr. Tarent, many people are wondering what the best wireless earphones are these days.","Nữ 1 (Harumi): Ông Tarent, nhiều người đang thắc mắc tai nghe không dây nào tốt nhất hiện nay."],
    ["I'd like to review some of the most popular ones on our website.","Tôi muốn đánh giá một số mẫu phổ biến nhất trên trang web của chúng ta."],
    ["Man (Mr. Tarent): Great idea, Harumi. That should increase our traffic.","Nam (ông Tarent): Ý tưởng tuyệt vời, Harumi. Việc đó sẽ giúp tăng lượng truy cập của chúng ta."],
    ["But can you work out an agreement with manufacturers to get some free items to review?","Nhưng cô có thể đạt được thỏa thuận với các nhà sản xuất để nhận một số sản phẩm miễn phí dùng cho việc đánh giá không?"],
    ["Our budget wouldn't allow us to buy them ourselves.","Ngân sách của chúng ta không cho phép tự mua những sản phẩm đó."],
    ["Woman 1 (Harumi): Oh, I'm not sure. I don't have many contacts in the electronics industry, actually.","Nữ 1 (Harumi): Ồ, tôi không chắc. Thật ra tôi không có nhiều mối liên hệ trong ngành điện tử."],
    ["Man (Mr. Tarent): Well, Janelle used to cover that field. Janelle?","Nam (ông Tarent): Janelle trước đây từng phụ trách lĩnh vực đó. Janelle?"],
    ["Woman 2 (Janelle): Yes, Mr. Tarent?","Nữ 2 (Janelle): Vâng, ông Tarent?"],
    ["Man (Mr. Tarent): Harumi needs some help with a new project.","Nam (ông Tarent): Harumi cần được giúp đỡ với một dự án mới."],
    ["Could you sit down with her to talk it over?","Cô có thể ngồi lại với cô ấy để thảo luận kỹ việc đó không?"],
    ["Woman 2 (Janelle): Absolutely. Is now a good time, Harumi?","Nữ 2 (Janelle): Chắc chắn rồi. Bây giờ có tiện không, Harumi?"],
    ["56. What type of products does Harumi want to review?","56. Harumi muốn đánh giá loại sản phẩm nào?"],
    ["57. What does the man ask Harumi about?","57. Người đàn ông hỏi Harumi về việc gì?"],
    ["58. What does the man request that Janelle do?","58. Người đàn ông yêu cầu Janelle làm gì?"]]},
  {part:"Part 3",title:"Questions 59–61",start:1508.6,end:1589.9,rows:[
    ["Man: Veronica, I'd like your advice.","Nam: Veronica, tôi muốn xin lời khuyên của cô."],
    ["Our gym's membership has been dropping over the last few months.","Số lượng hội viên của phòng tập chúng ta đã giảm trong vài tháng qua."],
    ["How could we bring in some new members?","Làm thế nào chúng ta có thể thu hút thêm hội viên mới?"],
    ["Woman (Veronica): Let me think... Well, we could try to advertise more.","Nữ (Veronica): Để tôi nghĩ xem... Chúng ta có thể thử quảng cáo nhiều hơn."],
    ["Instead of just putting ads in the newspaper, we could also hand out flyers, put up posters, and so on.","Thay vì chỉ đăng quảng cáo trên báo, chúng ta cũng có thể phát tờ rơi, treo áp phích, vân vân."],
    ["Man: I like it, but I'm concerned about whether our funds can stretch that far.","Nam: Tôi thích ý tưởng đó, nhưng tôi lo liệu ngân quỹ của chúng ta có đủ để chi trả đến mức ấy hay không."],
    ["The cost of regularly printing flyers and posters would add up pretty quickly.","Chi phí in tờ rơi và áp phích thường xuyên sẽ tăng lên khá nhanh."],
    ["Woman (Veronica): Good point. Um, then how about social media?","Nữ (Veronica): Ý kiến xác đáng. Ừm, vậy còn mạng xã hội thì sao?"],
    ["I don't know if that would be as effective, but it would certainly be cheaper.","Tôi không biết cách đó có hiệu quả bằng không, nhưng chắc chắn sẽ rẻ hơn."],
    ["59. What does the man ask for the woman's advice on?","59. Người đàn ông xin lời khuyên của người phụ nữ về vấn đề gì?"],
    ["60. What does the woman recommend?","60. Người phụ nữ đề xuất điều gì?"],
    ["61. Why is the man uncertain about the woman's suggestion?","61. Tại sao người đàn ông không chắc chắn về đề xuất của người phụ nữ?"]]},
  {part:"Part 3",title:"Questions 62–64",start:1589.9,end:1664.4,rows:[
    ["Man (Tyler): Hello Miss Bailey, this is Tyler from Yenville Services.","Nam (Tyler): Xin chào cô Bailey, tôi là Tyler từ công ty Dịch vụ Yenville."],
    ["I'm supposed to mow the lawn and pull up some weeds at your house this morning, but I can't seem to find it.","Tôi được giao cắt cỏ và nhổ một số cỏ dại tại nhà cô vào sáng nay, nhưng dường như tôi không thể tìm thấy nhà cô."],
    ["Woman (Miss Bailey): Okay, well, it's the white house on the corner of Flint and Poole, across from the bank.","Nữ (cô Bailey): Được rồi, đó là căn nhà màu trắng ở góc đường Flint và Poole, đối diện ngân hàng."],
    ["Man (Tyler): Oh really? That's the 600 block. Aren't you located at 561 Flint Street?","Nam (Tyler): Ồ, thật sao? Đó là dãy nhà số 600. Chẳng phải cô ở số 561 phố Flint sao?"],
    ["Woman (Miss Bailey): Uh, no, I'm at 651 Flint Street.","Nữ (cô Bailey): À không, tôi ở số 651 phố Flint."],
    ["Man (Tyler): Got it. Sorry for the confusion. I'll see you in a few minutes.","Nam (Tyler): Tôi hiểu rồi. Xin lỗi vì sự nhầm lẫn. Vài phút nữa tôi sẽ gặp cô."],
    ["62. Who most likely is the man?","62. Người đàn ông có khả năng là ai nhất?"],
    ["63. Look at the graphic. Where does the woman live?","63. Hãy nhìn vào hình. Người phụ nữ sống ở đâu?"],
    ["64. What is the problem?","64. Vấn đề là gì?"]]},
  {part:"Part 3",title:"Questions 65–67",start:1671,end:1758.6,rows:[
    ["Woman: Are you finding everything you need today, sir?","Nữ: Hôm nay ông có tìm thấy mọi thứ mình cần không ạ?"],
    ["Man: I have a question about these beautiful Chanter dinnerware sets, actually.","Nam: Thật ra tôi có một câu hỏi về những bộ đồ ăn Chanter đẹp mắt này."],
    ["Can I use them to warm food up in the microwave?","Tôi có thể dùng chúng để hâm nóng thức ăn trong lò vi sóng không?"],
    ["Woman: Yes. All of the pieces are made of microwave-safe ceramic.","Nữ: Có. Tất cả các món đều được làm bằng gốm an toàn khi dùng trong lò vi sóng."],
    ["And as you can see, they're on sale right now.","Và như ông có thể thấy, hiện giờ chúng đang được giảm giá."],
    ["How large of a set are you thinking of getting?","Ông đang định mua một bộ dành cho bao nhiêu người?"],
    ["Man: Well, that sale makes me want to buy a big one, but I really only need a 4-person set.","Nam: Đợt giảm giá đó khiến tôi muốn mua một bộ lớn, nhưng thực ra tôi chỉ cần bộ dành cho bốn người."],
    ["Woman: Sure, you can always come back and buy more later.","Nữ: Được chứ, sau này ông luôn có thể quay lại mua thêm."],
    ["Man: Oh, really? Won't they be gone in a few months?","Nam: Ồ, thật sao? Vài tháng nữa chúng sẽ hết hàng chứ?"],
    ["Woman: No, Chanter tends to offer the same designs for years. You'll have time.","Nữ: Không đâu, Chanter thường cung cấp cùng một mẫu thiết kế trong nhiều năm. Ông sẽ có thời gian."],
    ["65. What does the man want to know about the dinnerware sets?","65. Người đàn ông muốn biết điều gì về những bộ đồ ăn?"],
    ["66. Look at the graphic. How much money will the man save?","66. Hãy nhìn vào hình. Người đàn ông sẽ tiết kiệm được bao nhiêu tiền?"],
    ["67. What does the woman say about Chanter's products?","67. Người phụ nữ nói gì về các sản phẩm của Chanter?"]]},
  {part:"Part 3",title:"Questions 68–70",start:1758.6,end:1844.9,rows:[
    ["Man (Jay): Good morning, Nobuko. I got to the station a little early, so I bought you a coffee.","Nam (Jay): Chào buổi sáng, Nobuko. Tôi đến nhà ga hơi sớm nên đã mua cà phê cho cô."],
    ["Woman (Nobuko): Oh, thank you, Jay!","Nữ (Nobuko): Ồ, cảm ơn anh, Jay!"],
    ["Man (Jay): No problem. Are you all ready to present to our clients?","Nam (Jay): Không có gì. Cô đã hoàn toàn sẵn sàng thuyết trình cho khách hàng của chúng ta chưa?"],
    ["Woman (Nobuko): Absolutely! I have the presentation file on a portable storage drive, and I also emailed it to myself just in case.","Nữ (Nobuko): Hoàn toàn sẵn sàng! Tôi có tệp bài thuyết trình trong một ổ lưu trữ di động và cũng đã tự gửi nó vào thư điện tử của mình để phòng khi cần."],
    ["So, what platform are we leaving from?","Vậy chúng ta sẽ khởi hành từ sân ga nào?"],
    ["Man (Jay): Let's check the departure board... Oh no! Our train is delayed by a half an hour.","Nam (Jay): Hãy kiểm tra bảng giờ khởi hành... Ôi không! Tàu của chúng ta bị hoãn nửa giờ."],
    ["Woman (Nobuko): How annoying! Well, the presentation isn't until after lunch, so we should still be on time.","Nữ (Nobuko): Thật khó chịu! Bài thuyết trình mãi đến sau bữa trưa mới diễn ra nên chúng ta vẫn sẽ đến đúng giờ."],
    ["Why don't we go over our presentation strategy again while we wait?","Sao chúng ta không xem lại chiến lược thuyết trình trong lúc chờ?"],
    ["68. What does the woman say she has brought?","68. Người phụ nữ nói rằng cô ấy đã mang theo gì?"],
    ["69. Look at the graphic. What is the speakers' destination?","69. Hãy nhìn vào hình. Điểm đến của các nhân vật là đâu?"],
    ["70. What does the woman suggest doing?","70. Người phụ nữ đề nghị làm gì?"]]},
  {part:"Part 4",title:"Part 4 Directions",start:1844.9,end:1872,rows:[
    ["You will hear some talks given by a single speaker.","Bạn sẽ nghe một số bài nói do một người trình bày."],
    ["You will be asked to answer three questions about what the speaker says in each talk.","Bạn sẽ được yêu cầu trả lời ba câu hỏi về những gì người nói trình bày trong mỗi bài."],
    ["Select the best response to each question and mark the letter (A), (B), (C), or (D) on your answer sheet.","Hãy chọn đáp án phù hợp nhất cho mỗi câu hỏi rồi tô chữ cái (A), (B), (C) hoặc (D) trên phiếu trả lời."]]},
  {part:"Part 4",title:"Questions 71–73 · Telephone Message",start:1872,end:1948.3,rows:[
    ["Matt Miller: Hello Miss Singh, this is Matt Miller calling from Wells-Beaumont UK.","Matt Miller: Xin chào cô Singh, tôi là Matt Miller gọi từ Wells-Beaumont UK."],
    ["Thank you for your interest in our Senior Laboratory Researcher position.","Cảm ơn cô đã quan tâm đến vị trí Nhà nghiên cứu Phòng thí nghiệm Cấp cao của chúng tôi."],
    ["I'm happy to say that you are one of just a few candidates that we have chosen to move forward with.","Tôi vui mừng thông báo rằng cô là một trong số rất ít ứng viên mà chúng tôi chọn để tiếp tục quy trình tuyển dụng."],
    ["We like that you've already been successfully managing teams of researchers and technicians for several years, as proven leadership ability is required for the role.","Chúng tôi đánh giá cao việc cô đã quản lý thành công các nhóm nhà nghiên cứu và kỹ thuật viên trong nhiều năm, vì vị trí này yêu cầu năng lực lãnh đạo đã được chứng minh."],
    ["So, we would like you to come in for an interview next Tuesday at 9:00 AM.","Vì vậy, chúng tôi muốn mời cô đến phỏng vấn lúc 9 giờ sáng thứ Ba tới."],
    ["Please call me back at your earliest convenience so that we can confirm this arrangement.","Vui lòng gọi lại cho tôi sớm nhất khi thuận tiện để chúng ta có thể xác nhận sự sắp xếp này."],
    ["Thank you.","Cảm ơn cô."],
    ["71. Who most likely is the listener?","71. Người nghe có khả năng là ai nhất?"],
    ["72. What does the speaker say the listener has?","72. Người nói cho biết người nghe có điều gì?"],
    ["73. What does the speaker ask the listener to do?","73. Người nói yêu cầu người nghe làm gì?"]]},
  {part:"Part 4",title:"Questions 74–76 · Excerpt from a Meeting",start:1948.3,end:2031.1,rows:[
    ["Speaker: Good morning, team. Today we begin development of our new range of office chairs.","Người nói: Chào buổi sáng cả nhóm. Hôm nay chúng ta bắt đầu phát triển dòng ghế văn phòng mới."],
    ["Now, according to our market research data, office workers are looking for more comfortable chairs.","Theo dữ liệu nghiên cứu thị trường, nhân viên văn phòng đang tìm kiếm những chiếc ghế thoải mái hơn."],
    ["Because they sit at their desks for several hours a day, they prefer ergonomic seats that will reduce muscle and joint pain.","Vì họ ngồi tại bàn làm việc nhiều giờ mỗi ngày, họ thích những chiếc ghế có thiết kế công thái học giúp giảm đau cơ và khớp."],
    ["So that will be the focus of this line.","Vì vậy, đó sẽ là trọng tâm của dòng sản phẩm này."],
    ["I know that some of you are familiar with this kind of design, but I want everyone to have an in-depth understanding as we begin this project.","Tôi biết một số người trong các bạn đã quen thuộc với kiểu thiết kế này, nhưng tôi muốn mọi người có sự hiểu biết chuyên sâu khi chúng ta bắt đầu dự án."],
    ["So, I've hired an expert in ergonomics to come in and speak to us today.","Vì vậy, tôi đã thuê một chuyên gia về công thái học đến nói chuyện với chúng ta hôm nay."],
    ["She'll be here in about an hour.","Khoảng một giờ nữa cô ấy sẽ đến."],
    ["74. What product does the speaker's company sell?","74. Công ty của người nói bán sản phẩm gì?"],
    ["75. What does the company's target market want?","75. Thị trường mục tiêu của công ty muốn gì?"],
    ["76. What does the speaker say she has done?","76. Người nói cho biết cô ấy đã làm gì?"]]},
  {part:"Part 4",title:"Questions 77–79 · Telephone Message",start:2031.1,end:2111.7,rows:[
    ["David: Hi Catherine, this is David. I'm calling about your trip to San Francisco this Thursday for the skills development workshop.","David: Chào Catherine, tôi là David. Tôi gọi về chuyến đi San Francisco vào thứ Năm này của cô để tham dự hội thảo phát triển kỹ năng."],
    ["As you know, you were given special permission to turn in the travel request form on very short notice, several days after the usual deadline.","Như cô đã biết, cô được đặc cách nộp đơn yêu cầu đi công tác trong thời gian báo trước rất ngắn, muộn hơn hạn thông thường vài ngày."],
    ["Luckily, we've still been able to accommodate most of your preferences, except one.","May mắn thay, chúng tôi vẫn có thể đáp ứng phần lớn các nguyện vọng của cô, ngoại trừ một điều."],
    ["You asked to take Coastal Airlines because of your rewards membership, but I've booked you on West Coast Air instead.","Cô đề nghị bay với Coastal Airlines vì tư cách thành viên chương trình tích điểm, nhưng thay vào đó tôi đã đặt cho cô chuyến của West Coast Air."],
    ["West Coast Air flies direct to San Francisco, and it's our policy to book direct flights when possible.","West Coast Air có chuyến bay thẳng đến San Francisco, và chính sách của chúng ta là đặt chuyến bay thẳng khi có thể."],
    ["I hope you understand.","Tôi hy vọng cô thông cảm."],
    ["77. What event will the listener attend on Thursday?","77. Người nghe sẽ tham dự sự kiện gì vào thứ Năm?"],
    ["78. What does the speaker say about a form?","78. Người nói cho biết điều gì về một biểu mẫu?"],
    ["79. Why does the speaker say, “West Coast Air flies direct to San Francisco”?","79. Tại sao người nói nói rằng: ‘West Coast Air có chuyến bay thẳng đến San Francisco’?"]]},
  {part:"Part 4",title:"Questions 80–82 · Advertisement",start:2111.7,end:2196.1,rows:[
    ["Speaker: It's the middle of May, and that means it's time for Castleford's week-long “Screenings Under the Stars” festival.","Người nói: Hiện đang là giữa tháng Năm, và điều đó có nghĩa là đã đến lúc diễn ra lễ hội ‘Chiếu phim Dưới Ánh sao’ kéo dài một tuần của Castleford."],
    ["Every evening, from May 18th through 24th, the city will be showing a classic film on a large outdoor screen at Spruce Park.","Mỗi tối, từ ngày 18 đến ngày 24 tháng Năm, thành phố sẽ chiếu một bộ phim kinh điển trên màn hình lớn ngoài trời tại Công viên Spruce."],
    ["No tickets are necessary!","Không cần vé!"],
    ["Simply come to the west side of the park with something comfortable to sit on.","Chỉ cần đến phía tây công viên và mang theo thứ gì đó thoải mái để ngồi."],
    ["Food trucks will be available each night from 7:00 PM, and the film will be introduced by an expert at 8:00.","Các xe bán đồ ăn sẽ phục vụ mỗi tối từ 7 giờ, và một chuyên gia sẽ giới thiệu bộ phim lúc 8 giờ."],
    ["Don't miss this chance to enjoy classic cinema in a unique setting.","Đừng bỏ lỡ cơ hội thưởng thức điện ảnh kinh điển trong một không gian độc đáo."],
    ["To learn which films will be shown, visit our website: www.castleford-sus.com.","Để biết những bộ phim nào sẽ được chiếu, hãy truy cập trang web của chúng tôi: www.castleford-sus.com."],
    ["We hope to see you under the stars!","Chúng tôi hy vọng sẽ gặp bạn dưới bầu trời đầy sao!"],
    ["80. What type of event is the speaker advertising?","80. Người nói đang quảng cáo loại sự kiện nào?"],
    ["81. What are listeners encouraged to do?","81. Người nghe được khuyến khích làm gì?"],
    ["82. Why should listeners visit a website?","82. Tại sao người nghe nên truy cập một trang web?"]]},
  {part:"Part 4",title:"Questions 83–85 · Excerpt from a Meeting",start:2202.6,end:2281.1,rows:[
    ["Speaker: I'd like to give you all an update on the project to add a new wing to the community center.","Người nói: Tôi muốn cập nhật cho tất cả các bạn về dự án xây thêm một khu nhà mới cho trung tâm cộng đồng."],
    ["As you know, we're currently collecting funding donations from local businesses.","Như các bạn đã biết, hiện chúng ta đang quyên góp kinh phí từ các doanh nghiệp địa phương."],
    ["Well, I'm happy to say that we've already received more than $60,000, and we're still waiting for Jocelyn Associates.","Tôi vui mừng thông báo rằng chúng ta đã nhận được hơn 60.000 đô la và vẫn đang chờ khoản đóng góp từ Jocelyn Associates."],
    ["It looks like we will easily meet our fundraising goal.","Có vẻ như chúng ta sẽ dễ dàng đạt mục tiêu gây quỹ."],
    ["This is great, because it means that construction can start on time and probably finish in early summer.","Điều này thật tuyệt vì nó có nghĩa là việc xây dựng có thể bắt đầu đúng hạn và có lẽ sẽ hoàn thành vào đầu mùa hè."],
    ["I had been concerned about the August storms causing delays.","Trước đó tôi đã lo những cơn bão tháng Tám sẽ gây trì hoãn."],
    ["83. What is being discussed?","83. Nội dung gì đang được thảo luận?"],
    ["84. What does the speaker imply when she says, “We're still waiting for Jocelyn Associates”?","84. Người nói ngụ ý gì khi nói: ‘Chúng ta vẫn đang chờ Jocelyn Associates’?"],
    ["85. What was the speaker concerned about before?","85. Trước đây người nói đã lo lắng về điều gì?"]]},
  {part:"Part 4",title:"Questions 86–88 · Broadcast",start:2281.1,end:2362.1,rows:[
    ["Host: Hi everyone, and welcome to another week of Unwritten, the podcast about the lives of great novelists.","Người dẫn: Xin chào mọi người và chào mừng đến với một tuần mới của Unwritten, chương trình phát thanh trực tuyến về cuộc đời của các tiểu thuyết gia vĩ đại."],
    ["Today, we're going to talk about Dorothy Pearson, the genius who wrote Rose Branches when she was just 20 years old.","Hôm nay, chúng ta sẽ nói về Dorothy Pearson, thiên tài đã viết Rose Branches khi mới 20 tuổi."],
    ["But first, I need to say something about last week's episode on Jung-Soo Ahn.","Nhưng trước tiên, tôi cần nói một điều về tập tuần trước nói về Jung-Soo Ahn."],
    ["Yes, you heard that right, it's Jung-Soo, not Jong-Soo, which is what I called him throughout the episode.","Vâng, bạn nghe đúng rồi đấy, tên ông ấy là Jung-Soo chứ không phải Jong-Soo như cách tôi đã gọi ông ấy trong suốt tập đó."],
    ["I'm sorry about that!","Tôi xin lỗi về điều đó!"],
    ["Some very kind listeners alerted me to the mistake through the show's social media accounts.","Một số thính giả rất tốt bụng đã báo cho tôi về sai sót đó qua các tài khoản mạng xã hội của chương trình."],
    ["I hope that all of you will let me know when I've gotten something wrong like that.","Tôi hy vọng tất cả các bạn sẽ cho tôi biết khi tôi mắc lỗi tương tự như vậy."],
    ["I always appreciate it.","Tôi luôn trân trọng điều đó."],
    ["86. What is the topic of the podcast?","86. Chủ đề của chương trình phát thanh trực tuyến là gì?"],
    ["87. What does the speaker apologize for?","87. Người nói xin lỗi về điều gì?"],
    ["88. What does the speaker encourage listeners to do?","88. Người nói khuyến khích người nghe làm gì?"]]},
  {part:"Part 4",title:"Questions 89–91 · Excerpt from a Meeting",start:2362.1,end:2440.4,rows:[
    ["Speaker: Hi everyone, I called you in for this meeting because I'd like your help.","Người nói: Xin chào mọi người, tôi triệu tập các bạn đến cuộc họp này vì tôi muốn nhờ mọi người giúp đỡ."],
    ["As you probably know, I'll be introducing the Axion mobile phone at the Sydney Technology Expo this weekend.","Như các bạn có lẽ đã biết, tôi sẽ giới thiệu điện thoại di động Axion tại Triển lãm Công nghệ Sydney vào cuối tuần này."],
    ["Though it won't be released until August, this will be the first time that the world hears about it.","Mặc dù mãi đến tháng Tám sản phẩm mới được phát hành, đây sẽ là lần đầu tiên thế giới biết đến nó."],
    ["So the marketing team and I have been working hard on my presentation.","Vì vậy, đội ngũ tiếp thị và tôi đã làm việc rất chăm chỉ cho bài thuyết trình của tôi."],

  if(e.target.closest('.translation-highlight')&&translationRange){savedRange=translationRange.cloneRange();selectedText=translationText;selectedRow=translationRow;const mark=wrapSaved('span','user-highlight','#cfeeff');if(!mark)return toast('Không thể highlight vùng này');persistCard(mark);clearSelection();showHighlight(mark);toast('Đã highlight');return}

});
function nodeElement(node){return node.nodeType===1?node:node.parentElement}
function captureSelection(){const s=getSelection();if(!s||s.isCollapsed||!s.rangeCount||!s.toString().trim())return;const r=s.getRangeAt(0),startCol=nodeElement(r.startContainer)?.closest('.en-text,.vi-text'),endCol=nodeElement(r.endContainer)?.closest('.en-text,.vi-text');if(!startCol||startCol!==endCol)return;selectedRow=startCol.closest('[data-row]');savedRange=r.cloneRange();selectedText=s.toString().trim();tools.classList.add('show')}
document.addEventListener('mouseup',()=>setTimeout(captureSelection,20));document.addEventListener('touchend',()=>setTimeout(captureSelection,250));
function wrapSaved(tag,className,style,comment){if(!savedRange||!selectedText)return null;const el=document.createElement(tag);el.className=className;if(style)el.style.background=style;if(comment!==undefined)el.dataset.comment=comment;try{el.appendChild(savedRange.extractContents());savedRange.insertNode(el);return el}catch{return null}}
function persistCard(el){const c=el?.classList?.contains('card')?el:el?.closest?.('.card');if(!c)return;localStorage.setItem(`toeic6-v11-card-${c.dataset.index}`,c.querySelector('.rows').innerHTML)}
$$('.color-btn').forEach(b=>b.onclick=()=>{const mark=wrapSaved('span','user-highlight',b.dataset.color);if(!mark)return toast('Con hãy tô cụm từ trong cùng một ô');persistCard(mark);clearSelection();showHighlight(mark);toast('Đã lưu highlight')});
$('#commentBtn').onclick=()=>{if(!selectedText)return;const note=prompt('Ghi chú cho cụm đã chọn:','');if(note===null)return;if(!note.trim())return toast('Ghi chú không được để trống');const mark=wrapSaved('mark','user-mark','',note.trim());if(!mark)return toast('Con hãy tô cụm từ trong cùng một ô');persistCard(mark);clearSelection();showComment(mark);toast('Đã lưu comment')};
function decodeEntities(text){const box=document.createElement('textarea');box.innerHTML=text;return box.value}
async function fetchJson(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),9000);try{const response=await fetch(url,{signal:controller.signal,referrerPolicy:'no-referrer'});if(!response.ok)throw new Error('HTTP '+response.status);return await response.json()}finally{clearTimeout(timer)}}
async function translateOnline(text){try{const data=await fetchJson(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en%7Cvi`),value=decodeEntities(data?.responseData?.translatedText||'').trim();if(value)return value}catch{}try{const data=await fetchJson(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURIComponent(text)}`),value=(data?.[0]||[]).map(x=>x?.[0]||'').join('').trim();if(value)return value}catch{}const local=glossaryMap.get(text.toLowerCase().replace(/[.,?!:;“”‘’]/g,'').trim());if(local)return local[2];throw new Error('Không thể kết nối dịch trực tuyến')}
$('#translateBtn').onclick=async()=>{if(!selectedText||!savedRange)return;resetPopupState();translationRange=savedRange.cloneRange();translationText=selectedText;translationRow=selectedRow;tools.classList.remove('show');getSelection()?.removeAllRanges();popContent.innerHTML='<div class="translation-result">Đang dịch trực tuyến…</div>';pop.classList.add('show');try{translationValue=await translateOnline(translationText);popContent.innerHTML=`<div class="translation-result">${esc(translationValue)}</div><div class="translation-actions"><button class="translation-comment">💬 Thêm comment</button><button class="translation-highlight">Highlight</button><button class="translation-close">×</button></div>`}catch{popContent.innerHTML='<div class="translation-result">Không thể kết nối dịch trực tuyến. Con kiểm tra mạng rồi thử lại nhé.</div><div class="translation-actions"><button class="translation-close">×</button></div>'}};$('#closeTools').onclick=clearSelection;
function clearSelection(){tools.classList.remove('show');getSelection()?.removeAllRanges();savedRange=null;selectedText='';selectedRow=null}
function restoreNotes(){$$('.card').forEach(c=>{const x=localStorage.getItem(`toeic6-v11-card-${c.dataset.index}`);if(x)c.querySelector('.rows').innerHTML=x;c.querySelectorAll('.user-mark').forEach(m=>m.removeAttribute('style'))})}

let navIndex=-1;
function studyIndices(part){return cards.map((c,i)=>({c,i})).filter(x=>x.c.part===part&&getQuestionRange(x.c.title)).map(x=>x.i)}
$$('.filter').forEach(b=>b.onclick=()=>{setPart(b.dataset.part);applyFilter();scrollToActiveCard()});
function setPart(part,index){$$('.filter').forEach(x=>x.classList.toggle('active',x.dataset.part===part));if(part==='all'){navIndex=-1;return}const indices=studyIndices(part);navIndex=indices.includes(index)?index:(indices[0]??-1)}
function pageLabel(index){const range=getQuestionRange(cards[index]?.title||'');return range?(range[0]===range[1]?`Câu ${range[0]}`:`Câu ${range[0]}–${range[1]}`):''}
function updatePager(){const part=$('.filter.active')?.dataset.part||'all',indices=studyIndices(part),position=indices.indexOf(navIndex),show=part!=='all'&&position>=0;$('#prevPage').classList.toggle('show',show);$('#nextPage').classList.toggle('show',show);$('#pagerStatus').classList.toggle('show',show);$('#prevPage').disabled=!show||position===0;$('#nextPage').disabled=!show||position===indices.length-1;if(show)$('#pagerStatus').textContent=`${pageLabel(navIndex)} · ${position+1}/${indices.length}`}
function applyFilter(){const part=$('.filter.active')?.dataset.part||'all';document.body.classList.toggle('focus-mode',part!=='all');let n=0;$$('.card').forEach(c=>{const show=part==='all'||+c.dataset.index===navIndex;c.classList.toggle('hidden',!show);if(show)n++});$$('.section-title').forEach(h=>{let el=h.nextElementSibling,show=false;while(el&&!el.classList.contains('section-title')){if(el.classList.contains('card')&&!el.classList.contains('hidden'))show=true;el=el.nextElementSibling}h.classList.toggle('hidden',!show)});$('#empty').classList.toggle('hidden',n>0);updatePager()}

function getQuestionRange(title){const m=title.match(/Questions? (\d+)(?:[–-](\d+))?/);return m?[+m[1],+(m[2]||m[1])]:null}

render();setBarCollapsed(localStorage.getItem('toeic6-bar-collapsed')==='1');

<script id="test6-v16-script">
(function(){
  const topbar = document.getElementById('topbar');
  if(topbar && !document.getElementById('modeToggleBtn')){
    const qbtn = document.getElementById('questionMenuBtn');
    if(qbtn) qbtn.insertAdjacentHTML('beforebegin','<button id="modeToggleBtn" title="Chuyển sang tab đề">📝 Đề</button>');
  }
  const modeToggleBtn = document.getElementById('modeToggleBtn');
  const submitBtn = document.createElement('button'); submitBtn.id='submitExamBtn'; submitBtn.textContent='Nộp bài';
  const resetBtn = document.createElement('button'); resetBtn.id='resetExamBtn'; resetBtn.textContent='Làm lại';
  const summaryChip = document.createElement('div'); summaryChip.id='examSummaryChip'; summaryChip.textContent='Đã chọn 0/100';
  const partJumpBtn = document.createElement('button'); partJumpBtn.id='partJumpBtn'; partJumpBtn.textContent='Làm part'; partJumpBtn.title='Chọn Part để làm';
  const questionMenuBtnForPart = document.getElementById('questionMenuBtn');
  if(questionMenuBtnForPart) questionMenuBtnForPart.insertAdjacentElement('beforebegin', partJumpBtn); else topbar?.appendChild(partJumpBtn);
  const rail = document.createElement('div'); rail.id='examActionRail'; [submitBtn,resetBtn,summaryChip].forEach(el=>rail.appendChild(el)); document.body.appendChild(rail);
  const partJumpModal = document.createElement('div'); partJumpModal.id='partJumpModal'; partJumpModal.className='part-jump-modal';
  partJumpModal.innerHTML = `<div class="part-jump-panel"><h3>Đi tới phần</h3><div class="part-jump-grid"><button data-part-nav="all">Tất cả</button><button data-part-nav="Part 1">Part 1</button><button data-part-nav="Part 2">Part 2</button><button data-part-nav="Part 3">Part 3</button><button data-part-nav="Part 4">Part 4</button></div><button class="part-jump-close">Đóng</button></div>`;
  document.body.appendChild(partJumpModal); window.partJumpModal = partJumpModal;

  const renderStudyView = render;
  window.viewMode = 'study';
  let examResponses = {};
  let examSubmitted = false;

  function stripOption(text){return String(text||'').replace(/^\(([A-D])\)\s*/,'').trim();}
  function stripNumber(text){return String(text||'').replace(/^\d+\.\s*/,'').trim();}
  const stemViMap = {}, dynamicItems = new Map();
  cards.forEach(c => {
    c.rows.forEach(row => {
      const m = String(row[0]||'').match(/^(\d+)\.\s*(.*)/);
      if(m) stemViMap[+m[1]] = stripNumber(row[1]||'');
    });
    const m = String(c.title||'').match(/^Question (\d+)$/);
    if(!m) return;
    const n = +m[1];
    if(n<=6){
      dynamicItems.set(n,{n,part:'Part 1',stem:'Choose the best description of the picture.',stemVi:'Chọn câu mô tả đúng nhất bức tranh.',options:{A:stripOption(c.rows[0][0]),B:stripOption(c.rows[1][0]),C:stripOption(c.rows[2][0]),D:stripOption(c.rows[3][0])},viOptions:[stripOption(c.rows[0][1]),stripOption(c.rows[1][1]),stripOption(c.rows[2][1]),stripOption(c.rows[3][1])]});
    } else if(n<=31){
      dynamicItems.set(n,{n,part:'Part 2',stem:c.rows[0][0],stemVi:c.rows[0][1],options:{A:stripOption(c.rows[1][0]),B:stripOption(c.rows[2][0]),C:stripOption(c.rows[3][0])},viOptions:[stripOption(c.rows[1][1]),stripOption(c.rows[2][1]),stripOption(c.rows[3][1])]});
    }
  });
  const fullExamItems = new Map();
  for(let n=1;n<=31;n++){ const item = dynamicItems.get(n); if(item) fullExamItems.set(n,item); }
  examQuestions.forEach(item => fullExamItems.set(item.n,{n:item.n,part:item.n<=70?'Part 3':'Part 4',stem:item.stem,stemVi:stemViMap[item.n]||'',options:item.options,viOptions:viOptions[item.n]||[]}));

  function syncToolbarGeometry(){
    const tb = document.getElementById('topbar');
    if(!tb) return;
    const r = tb.getBoundingClientRect();
    document.documentElement.style.setProperty('--tb-bottom', Math.max(0, r.bottom) + 'px');
  }
  window.addEventListener('resize', syncToolbarGeometry, {passive:true});
  window.visualViewport?.addEventListener('resize', syncToolbarGeometry, {passive:true});
  window.visualViewport?.addEventListener('scroll', syncToolbarGeometry, {passive:true});
  window.addEventListener('orientationchange', ()=>{syncToolbarGeometry();setTimeout(syncToolbarGeometry,120);setTimeout(syncToolbarGeometry,350);}, {passive:true});
  new MutationObserver(()=>requestAnimationFrame(syncToolbarGeometry)).observe(document.getElementById('topbar'), {attributes:true,subtree:true,childList:true});

  function updateModeUI(){
    document.body.classList.toggle('exam-mode', window.viewMode==='exam');
    modeToggleBtn.textContent = window.viewMode==='exam' ? '📘 Học' : '📝 Đề';
    modeToggleBtn.title = window.viewMode==='exam' ? 'Chuyển sang tab học' : 'Chuyển sang tab đề';
    submitBtn.style.display = window.viewMode==='exam' ? 'block' : 'none';
    resetBtn.style.display = window.viewMode==='exam' ? 'block' : 'none';
    summaryChip.style.display = window.viewMode==='exam' ? 'block' : 'none';
    submitBtn.textContent = examSubmitted ? 'Đã chấm' : 'Nộp bài';
    requestAnimationFrame(syncToolbarGeometry);
  }
  function examChoiceClass(n,letter){
    const selected = examResponses[n]===letter;
    if(!examSubmitted) return selected ? ' selected' : '';
    const correct = answerKey[n]===letter;
    if(correct) return ' correct-answer' + (selected?' selected':'');
    if(selected) return ' wrong-answer selected';
    return '';
  }
  function renderExamBubbleOptions(n, letters){ return `<div class="exam-bubble-grid">${letters.map(letter=>`<label class="exam-bubble${examChoiceClass(n,letter)}" data-q="${n}" data-choice="${letter}"><input type="radio" name="exam-q-${n}" value="${letter}" ${examResponses[n]===letter?'checked':''}><span>${letter}</span></label>`).join('')}</div>`; }
  function renderPart1Exam(n){ return `<div class="exam-card-block"><div class="exam-paper-note">Question ${n}</div>${renderExamBubbleOptions(n,['A','B','C','D'])}</div>`; }
  function renderPart2Exam(n){ return `<div class="exam-card-block"><div class="exam-paper-note">Question ${n}</div>${renderExamBubbleOptions(n,['A','B','C'])}</div>`; }
  function renderExamQuestionBlock(n){
    const item = fullExamItems.get(n); if(!item) return '';
    const graphic = graphicForQuestion[n] ? renderGraphic(graphicForQuestion[n]) : '';
    const letters = Object.keys(item.options);
    const opts = letters.map((letter,idx)=>`<label class="exam-option-card${examChoiceClass(n,letter)}" data-q="${n}" data-choice="${letter}"><input type="radio" name="exam-q-${n}" value="${letter}" ${examResponses[n]===letter?'checked':''}><span class="opt-en"><span class="option-letter">(${letter})</span>${esc(item.options[letter]||'')}</span></label>`).join('');
    return `<section class="exam-question-block" data-question="${n}">${graphic}<div class="exam-q-head">${n}. ${esc(item.stem)}</div><div class="exam-options-stack">${opts}</div></section>`;
  }
  function renderExamCard(c){
    const range = getQuestionRange(c.title); if(!range) return '';
    if(c.part==='Part 1' && range[0]===range[1]) return renderPart1Exam(range[0]);
    if(c.part==='Part 2' && range[0]===range[1]) return renderPart2Exam(range[0]);
    let out=''; for(let n=range[0]; n<=range[1]; n++) out += renderExamQuestionBlock(n);
    return `<div class="exam-card-block"><div class="exam-set-title">${esc(c.title)}</div><div class="exam-questions-panel">${out}</div></div>`;
  }
  function buildCardShell(c,i,inner,section){ return `${section}<article class="card" id="card-${i}" data-index="${i}" data-part="${esc(c.part)}"><header class="card-head"><div class="card-heading"><span class="badge">${esc(c.part)}</span><span class="card-title">${esc(c.title)}</span></div><div class="audio-wrap"><div class="audio-controls"><button class="skip" data-act="back" aria-label="Lùi 5 giây">−5s</button><button class="play" data-act="play">▶ Phát</button><button class="skip" data-act="forward" aria-label="Tới 5 giây">+5s</button><span class="time">${fmt(c.start)} / ${fmt(c.end)}</span></div><div class="progress"><i></i></div></div></header><div class="learning-frame">${inner}</div></article>`; }
  function renderExamView(){
    let part=''; const examCards = cards.map((c,i)=>({c,i})).filter(x=>getQuestionRange(x.c.title));
    cardsEl.innerHTML = examCards.map(({c,i})=>{ const section = c.part!==part?`<h2 class="section-title" data-section="${esc(c.part)}">${esc(c.part)}</h2>`:''; part=c.part; return buildCardShell(c,i,renderExamCard(c),section); }).join('');
    restoreNotes(); buildQuestionMenu(); injectPartControls();
  }
  function injectPartControls(){
    const starts = {};
    ['Part 1','Part 2','Part 3','Part 4'].forEach(part => { const first = cards.find(c=>c.part===part); if(first) starts[part]=first.start; });
    document.querySelectorAll('.section-title[data-section]').forEach(title => {
      const part = title.dataset.section;
      if(!starts[part] || title.querySelector('.part-audio-controls')) return;
      const wrap = document.createElement('span'); wrap.className='part-audio-controls';
      wrap.innerHTML = `<button class="part-play" data-part-play="${part}">▶ Part</button><button class="part-pause" data-part-pause="${part}">❚❚</button>`;
      title.appendChild(wrap);
    });
  }
  function rebuildCurrentView(){ if(window.viewMode==='exam') renderExamView(); else { renderStudyView(); injectPartControls(); } applyFilter(); updateModeUI(); updateSummary(); }
  function updateSummary(){
    const answered = Object.keys(examResponses).filter(k=>examResponses[k]).length;
    if(window.viewMode!=='exam'){ summaryChip.textContent = `Đã chọn ${answered}/100`; return; }
    if(!examSubmitted){ summaryChip.textContent = `Đã chọn ${answered}/100`; return; }
    let correct=0; for(let n=1;n<=100;n++) if(examResponses[n]===answerKey[n]) correct++;
    summaryChip.textContent = `Đúng ${correct}/100`;
  }
  function setMode(mode){ window.viewMode=mode; rebuildCurrentView(); }
  function markExamSelection(choiceEl){
    const q = +choiceEl.dataset.q, letter = choiceEl.dataset.choice; examResponses[q]=letter; localStorage.setItem('toeic6-v17-exam-responses', JSON.stringify(examResponses));
    if(window.viewMode!=='exam') return; if(examSubmitted){ updateSummary(); rebuildCurrentView(); return; }
    const root = choiceEl.parentElement; root.querySelectorAll(`[data-q="${q}"]`).forEach(el=>el.classList.remove('selected')); root.querySelectorAll(`input[name="exam-q-${q}"]`).forEach(r=>r.checked=(r.value===letter)); root.querySelectorAll(`[data-q="${q}"][data-choice="${letter}"]`).forEach(el=>el.classList.add('selected')); updateSummary();
  }
  cardsEl.addEventListener('click', function(e){ if(window.viewMode!=='exam') return; const choice=e.target.closest('.exam-bubble, .exam-option-card, .exam-choice-row'); if(!choice) return; e.preventDefault(); markExamSelection(choice); }, true);
  modeToggleBtn.addEventListener('click', ()=>setMode(window.viewMode==='exam'?'study':'exam'));
  submitBtn.addEventListener('click', ()=>{ if(window.viewMode!=='exam') return; examSubmitted=true; localStorage.setItem('toeic6-v17-exam-submitted','1'); rebuildCurrentView(); let correct=0; for(let n=1;n<=100;n++) if(examResponses[n]===answerKey[n]) correct++; toast(`Con đúng ${correct}/100 câu`); });
  resetBtn.addEventListener('click', ()=>{ examResponses={}; examSubmitted=false; localStorage.removeItem('toeic6-v17-exam-responses'); localStorage.removeItem('toeic6-v17-exam-submitted'); rebuildCurrentView(); toast('Đã làm lại tab đề'); });
  partJumpBtn.addEventListener('click', ()=>partJumpModal.classList.add('show'));
  partJumpModal.addEventListener('click', e=>{ if(e.target===partJumpModal || e.target.closest('.part-jump-close')){ partJumpModal.classList.remove('show'); return; } const btn=e.target.closest('[data-part-nav]'); if(!btn) return; const part=btn.dataset.partNav; setPart(part); applyFilter(); partJumpModal.classList.remove('show'); scrollToActiveCard(); });
  document.addEventListener('click', e=>{ const pb=e.target.closest('[data-part-play]'); if(pb){ if(!ensureAudio()) return; const part=pb.dataset.partPlay; const first=cards.find(c=>c.part===part); if(!first) return; active=-1; audio.currentTime=first.start; audio.play(); updateButtons(); return; } const pauseb=e.target.closest('[data-part-pause]'); if(pauseb){ audio.pause(); updateButtons(); } });
  try{ const saved=JSON.parse(localStorage.getItem('toeic6-v17-exam-responses')||'{}'); if(saved && typeof saved==='object') examResponses=saved; examSubmitted = localStorage.getItem('toeic6-v17-exam-submitted')==='1'; }catch(_){ }
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') partJumpModal.classList.remove('show'); });
  updateModeUI(); updateSummary(); injectPartControls(); syncToolbarGeometry();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
