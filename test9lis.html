"t9-bi-row prompt-row","en":"Who's responsible for approving purchasing requests when Nick is away?","vi":"Ai chịu trách nhiệm phê duyệt yêu cầu mua hàng khi Nick vắng mặt?"},{"cls":"t9-bi-row option-row","en":"<b>(A)</b> That's an excellent idea.","vi":"<b>(A)</b> Đó là một ý tưởng tuyệt vời."},{"cls":"t9-bi-row option-row","en":"<b>(B)</b> But he'll be back this afternoon.","vi":"<b>(B)</b> Nhưng chiều nay anh ấy sẽ quay lại."},{"cls":"t9-bi-row option-row","en":"<b>(C)</b> It's for a filing cabinet for the sales department.","vi":"<b>(C)</b> Nó dành cho một tủ hồ sơ của phòng kinh doanh."}]},{"part":"Part 3","label":"Questions 32–34","segment":"q32-34","start":823.4,"end":894.7,"questions":[32,33,34],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Man: Lynette, while you were at your meeting I took a call from Carla Burns at Sneddler Associates. She has that law conference in Sydney next month. She said she asked you to plan her trip back today, and she's worried that she hasn't heard back from you.","vi":"Người đàn ông: Lynette, trong lúc cô đi họp, tôi nhận cuộc gọi từ Carla Burns ở Sneddler Associates. Tháng tới cô ấy có hội nghị luật ở Sydney. Cô ấy nói đã nhờ cô lên kế hoạch chuyến đi từ hôm nay và đang lo vì chưa nhận được phản hồi."},{"cls":"t9-bi-row dialogue-row","en":"Woman: Oh, I took care of all her flight and hotel bookings this morning. I just didn't have time to tell her before my meeting.","vi":"Người phụ nữ: Ồ, sáng nay tôi đã lo xong toàn bộ việc đặt vé máy bay và khách sạn cho cô ấy. Tôi chỉ chưa kịp báo trước cuộc họp."},{"cls":"t9-bi-row dialogue-row","en":"Man: Okay, well, please send her a <mark class=\"term\" data-ipa=\"/ˌkɑːnfɚˈmeɪʃən ˈiːmeɪl/\" data-meaning=\"email xác nhận\" tabindex=\"0\">confirmation email</mark> right now. I want her to know that everything has been arranged.","vi":"Người đàn ông: Được rồi, hãy gửi email xác nhận cho cô ấy ngay bây giờ. Tôi muốn cô ấy biết mọi thứ đã được sắp xếp."}]},{"part":"Part 3","label":"Questions 35–37","segment":"q35-37","start":888.7,"end":977.8,"questions":[35,36,37],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Man 1 (Karl): Welcome to Riverside Coffee. What can I get for you?","vi":"Karl: Chào mừng đến Riverside Coffee. Tôi có thể phục vụ gì cho cô?"},{"cls":"t9-bi-row dialogue-row","en":"Woman: I'd like a latte, but do you have almond milk? I'd like that instead of regular milk, please.","vi":"Người phụ nữ: Tôi muốn một ly latte, nhưng quán có sữa hạnh nhân không? Tôi muốn dùng loại đó thay sữa thường."},{"cls":"t9-bi-row dialogue-row","en":"Man 1 (Karl): Oh, I'm sorry, but we don't have that.","vi":"Karl: Xin lỗi, chúng tôi không có."},{"cls":"t9-bi-row dialogue-row","en":"Man 2 (Bill): Excuse me, Karl. We actually started carrying almond milk last week because customers kept asking for it.","vi":"Bill: Xin lỗi Karl. Thực ra từ tuần trước chúng ta đã bắt đầu bán sữa hạnh nhân vì khách hàng liên tục yêu cầu."},{"cls":"t9-bi-row dialogue-row","en":"Man 1 (Karl): Oh, I had no idea. Thanks for the correction, Bill. Okay ma'am, it looks like we'll be able to <mark class=\"term\" data-ipa=\"/əˈkɑːmədeɪt/\" data-meaning=\"đáp ứng; phục vụ theo yêu cầu\" tabindex=\"0\">accommodate</mark> you. There's a 50-cent <mark class=\"term\" data-ipa=\"/əˈdɪʃənəl tʃɑːrdʒ/\" data-meaning=\"phụ phí\" tabindex=\"0\">additional charge</mark> for substitutions though. Is that okay?","vi":"Karl: Ồ, tôi không biết. Cảm ơn đã sửa nhé Bill. Thưa cô, có vẻ chúng tôi có thể đáp ứng yêu cầu. Tuy nhiên thay nguyên liệu sẽ phụ thu 50 xu. Có được không?"},{"cls":"t9-bi-row dialogue-row","en":"Woman: That's no problem. Oh, I have this coupon for a free drink for <mark class=\"term\" data-ipa=\"/ˈfriːkwənt ˈkʌstəmɚz/\" data-meaning=\"khách hàng thường xuyên\" tabindex=\"0\">frequent customers</mark>, too. Can I use it to pay for this drink?","vi":"Người phụ nữ: Không vấn đề gì. Tôi còn có phiếu đồ uống miễn phí dành cho khách thường xuyên. Tôi dùng nó thanh toán ly này được không?"},{"cls":"t9-bi-row dialogue-row","en":"Man 2 (Bill): Sure.","vi":"Bill: Được."}]},{"part":"Part 3","label":"Questions 38–40","segment":"q38-40","start":971.8,"end":1053.35,"questions":[38,39,40],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Woman: All right. Now let's talk about who to cast in the side parts. First up is the character of the uncle. I liked Simon Witherspoon. I think he'd give the play a lively energy.","vi":"Người phụ nữ: Được rồi. Giờ hãy bàn xem ai sẽ đóng các vai phụ. Trước tiên là nhân vật người chú. Tôi thích Simon Witherspoon. Tôi nghĩ anh ấy sẽ mang năng lượng sôi nổi cho vở diễn."},{"cls":"t9-bi-row dialogue-row","en":"Man: It's true that he's quite a <mark class=\"term\" data-ipa=\"/daɪˈnæmɪk pɚˈfɔːrmɚ/\" data-meaning=\"người biểu diễn năng động\" tabindex=\"0\">dynamic performer</mark>, but the character really needs to be able to sing. And the music part of Simon's audition was not impressive.","vi":"Người đàn ông: Đúng là anh ấy biểu diễn rất năng động, nhưng nhân vật này thực sự phải biết hát. Phần âm nhạc trong buổi thử vai của Simon không ấn tượng."},{"cls":"t9-bi-row dialogue-row","en":"Woman: Well, then let's get him a singing coach. I think it's <mark class=\"term\" data-ipa=\"/wɝːθ ði ɪnˈvɛstmənt/\" data-meaning=\"đáng để đầu tư\" tabindex=\"0\">worth the investment</mark>.","vi":"Người phụ nữ: Vậy hãy thuê huấn luyện viên thanh nhạc cho anh ấy. Tôi nghĩ khoản đầu tư đó đáng giá."},{"cls":"t9-bi-row dialogue-row","en":"Man: I'm not convinced. Let's move on to another character for now and talk about casting the uncle again later.","vi":"Người đàn ông: Tôi chưa bị thuyết phục. Tạm chuyển sang nhân vật khác và lát nữa bàn lại vai người chú."}]},{"part":"Part 3","label":"Questions 41–43","segment":"q41-43","start":1047.35,"end":1135.5,"questions":[41,42,43],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Woman: Good morning. I'd like to <mark class=\"term\" data-ipa=\"/tʃɛk aʊt/\" data-meaning=\"trả phòng\" tabindex=\"0\">check out</mark>. Here's my room key.","vi":"Người phụ nữ: Chào buổi sáng. Tôi muốn trả phòng. Đây là chìa khóa phòng."},{"cls":"t9-bi-row dialogue-row","en":"Man: Thank you. Just a moment. Okay, Ms. Suzuki, here's the bill for your stay.","vi":"Người đàn ông: Cảm ơn. Xin chờ một chút. Được rồi, cô Suzuki, đây là hóa đơn kỳ lưu trú của cô."},{"cls":"t9-bi-row dialogue-row","en":"Woman: Oh, this is charging me for two nights! But I arrived yesterday morning. I'm attending the engineering convention.","vi":"Người phụ nữ: Ồ, hóa đơn tính tôi hai đêm! Nhưng tôi mới đến sáng hôm qua. Tôi đến dự hội nghị kỹ thuật."},{"cls":"t9-bi-row dialogue-row","en":"Man: Hmm, I'm not sure why, but our system has you <mark class=\"term\" data-ipa=\"/ˈlɪstɪd fɔːr/\" data-meaning=\"được ghi/đăng ký cho\" tabindex=\"0\">listed for</mark> July 1st and 2nd in Room 407.","vi":"Người đàn ông: Tôi không rõ vì sao, nhưng hệ thống ghi cô ở phòng 407 vào ngày 1 và 2 tháng Bảy."},{"cls":"t9-bi-row dialogue-row","en":"Woman: Well, I did originally book two nights, but I changed my reservation about a week ago. Oh, would you like to see my <mark class=\"term\" data-ipa=\"/ˌkɑːnfɚˈmeɪʃən ˈiːmeɪl/\" data-meaning=\"email xác nhận\" tabindex=\"0\">confirmation email</mark>? I think I have the printout here in my purse.","vi":"Người phụ nữ: Ban đầu tôi có đặt hai đêm, nhưng khoảng một tuần trước tôi đã đổi đặt phòng. Anh có muốn xem email xác nhận không? Tôi nghĩ bản in đang ở trong túi xách."},{"cls":"t9-bi-row dialogue-row","en":"Man: That would be very helpful.","vi":"Người đàn ông: Như vậy sẽ rất hữu ích."}]},{"part":"Part 3","label":"Questions 44–46","segment":"q44-46","start":1129.5,"end":1216.3,"questions":[44,45,46],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Woman (Megan): Delmer, I've finished loading the products onto the truck for the 11 o'clock shipment. It just left. I'm going to take my break now.","vi":"Megan: Delmer, tôi đã chất xong hàng lên xe tải cho chuyến 11 giờ. Xe vừa đi rồi. Giờ tôi sẽ nghỉ giải lao."},{"cls":"t9-bi-row dialogue-row","en":"Man (Delmer): Sure, Megan. But can I talk to you for a minute first? I noticed you rubbing your back earlier. Are you having back pain?","vi":"Delmer: Được Megan. Nhưng trước đó tôi nói với cô một phút được không? Lúc nãy tôi thấy cô xoa lưng. Cô bị đau lưng à?"},{"cls":"t9-bi-row dialogue-row","en":"Woman (Megan): A little bit, actually. But I'm sure that it will go away once I get the chance to relax this weekend.","vi":"Megan: Hơi đau một chút. Nhưng chắc cuối tuần được nghỉ ngơi thì sẽ hết."},{"cls":"t9-bi-row dialogue-row","en":"Man (Delmer): I hope so. If it doesn't, come and see me. I can recommend a massage therapist who specializes in treating lower back pain. Several other workers have gone to see her and they say she's great.","vi":"Delmer: Mong là vậy. Nếu không hết thì đến gặp tôi. Tôi có thể giới thiệu một chuyên viên mát-xa chuyên trị đau lưng dưới. Vài công nhân khác đã đến gặp cô ấy và đều nói rất tốt."}]},{"part":"Part 3","label":"Questions 47–49","segment":"q47-49","start":1210.3,"end":1294.5,"questions":[47,48,49],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Man (Randall): Hi Jody, it's Randall Fisher. Did you get the <mark class=\"term\" data-ipa=\"/dræft liːs/\" data-meaning=\"dự thảo hợp đồng thuê\" tabindex=\"0\">draft lease</mark> I sent you for <mark class=\"term\" data-ipa=\"/ˈliːɡəl rɪˈvjuː/\" data-meaning=\"rà soát pháp lý\" tabindex=\"0\">legal review</mark>? If everything looks good, I'd like to move my music shop into the space as soon as possible.","vi":"Randall: Chào Jody, tôi là Randall Fisher. Cô đã nhận bản dự thảo hợp đồng thuê tôi gửi để rà soát pháp lý chưa? Nếu mọi thứ ổn, tôi muốn chuyển cửa hàng nhạc cụ vào đó càng sớm càng tốt."},{"cls":"t9-bi-row dialogue-row","en":"Woman (Jody): I was planning to email you about that. As your business lawyer, I'm concerned that the agreement doesn't allow you to transfer the lease or <mark class=\"term\" data-ipa=\"/ˌsʌbˈlɛt/\" data-meaning=\"cho thuê lại\" tabindex=\"0\">sublet</mark> the space. You'd be stuck there for the entire lease period. That's not very advantageous to you.","vi":"Jody: Tôi đang định email cho anh. Với tư cách luật sư doanh nghiệp của anh, tôi lo rằng hợp đồng không cho phép chuyển nhượng hợp đồng thuê hoặc cho thuê lại. Anh sẽ bị ràng buộc ở đó suốt thời hạn thuê, điều này không có lợi."},{"cls":"t9-bi-row dialogue-row","en":"Man (Randall): Oh, I see.","vi":"Randall: Ồ, tôi hiểu."},{"cls":"t9-bi-row dialogue-row","en":"Woman (Jody): Of course, you could ask the landlord to revise that part of the lease, but you might have to give him something in return—higher rental fees, for example. Would you consider that?","vi":"Jody: Tất nhiên anh có thể yêu cầu chủ nhà sửa phần đó, nhưng có thể phải đổi lại bằng thứ gì đó, chẳng hạn tiền thuê cao hơn. Anh có cân nhắc không?"}]},{"part":"Part 3","label":"Questions 50–52","segment":"q50-52","start":1288.5,"end":1367.85,"questions":[50,51,52],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Man (Simon): Hi Heather, I'm glad you could join us for this meeting, even though you're working from home today. Can you see and hear us all right?","vi":"Simon: Chào Heather, rất vui vì cô có thể tham gia cuộc họp dù hôm nay làm việc tại nhà. Cô có nhìn và nghe chúng tôi rõ không?"},{"cls":"t9-bi-row dialogue-row","en":"Woman 1 (Heather): Hi Simon and Donna. Yes, the video and audio seem to be working just fine.","vi":"Heather: Chào Simon và Donna. Có, hình ảnh và âm thanh đều hoạt động tốt."},{"cls":"t9-bi-row dialogue-row","en":"Man (Simon): Great! Let's get started then. Donna?","vi":"Simon: Tuyệt. Vậy bắt đầu nhé. Donna?"},{"cls":"t9-bi-row dialogue-row","en":"Woman 2 (Donna): All right. As you both know, we'll be talking today about our proposed revisions to the <mark class=\"term\" data-ipa=\"/ɛmˈplɔɪi ˈhændbʊk/\" data-meaning=\"sổ tay nhân viên\" tabindex=\"0\">employee handbook</mark>. Heather, do you have your materials at hand?","vi":"Donna: Được rồi. Như mọi người biết, hôm nay chúng ta sẽ bàn về các sửa đổi đề xuất đối với sổ tay nhân viên. Heather, cô có tài liệu bên cạnh chứ?"},{"cls":"t9-bi-row dialogue-row","en":"Woman 1 (Heather): Yep.","vi":"Heather: Có."},{"cls":"t9-bi-row dialogue-row","en":"Woman 2 (Donna): Great. Then let's begin by discussing how each of our assigned sections is coming along.","vi":"Donna: Tốt. Vậy hãy bắt đầu bằng cách trao đổi tiến độ của từng phần được giao."}]},{"part":"Part 3","label":"Questions 53–55","segment":"q53-55","start":1361.85,"end":1446.85,"questions":[53,54,55],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Woman: Good evening, sir. Is Ireland your final destination?","vi":"Người phụ nữ: Chào buổi tối. Ireland có phải điểm đến cuối cùng của ông không?"},{"cls":"t9-bi-row dialogue-row","en":"Man: Yes, I'm visiting Dublin for a few days on business.","vi":"Người đàn ông: Vâng, tôi đến Dublin vài ngày để công tác."},{"cls":"t9-bi-row dialogue-row","en":"Woman: All right. Then you'll need to fill out this <mark class=\"term\" data-ipa=\"/ˈlændɪŋ kɑːrd/\" data-meaning=\"thẻ nhập cảnh\" tabindex=\"0\">landing card</mark> and submit it to immigration when the plane lands.","vi":"Người phụ nữ: Vậy ông cần điền thẻ nhập cảnh này và nộp cho cơ quan nhập cư khi máy bay hạ cánh."},{"cls":"t9-bi-row dialogue-row","en":"Man: Oh, okay. Do you have a pen I could borrow?","vi":"Người đàn ông: Được. Cô có bút cho tôi mượn không?"},{"cls":"t9-bi-row dialogue-row","en":"Woman: Sure, here you are.","vi":"Người phụ nữ: Có, đây ạ."},{"cls":"t9-bi-row dialogue-row","en":"Man: Thanks. Oh, this card is asking for my passport number, but I don't have it memorized, and my passport is in my bag in the <mark class=\"term\" data-ipa=\"/ˌoʊvɚˈhɛd kəmˈpɑːrtmənt/\" data-meaning=\"ngăn hành lý phía trên\" tabindex=\"0\">overhead compartment</mark>.","vi":"Người đàn ông: Cảm ơn. Thẻ này hỏi số hộ chiếu, nhưng tôi không nhớ và hộ chiếu ở trong túi trên ngăn hành lý phía trên."},{"cls":"t9-bi-row dialogue-row","en":"Woman: Well, the fasten seatbelt sign is off, so you can open up the compartment now if you'd like. Just make sure to close it when you're finished.","vi":"Người phụ nữ: Đèn thắt dây an toàn đã tắt, nên ông có thể mở ngăn đó nếu muốn. Chỉ cần nhớ đóng lại khi xong."}]},{"part":"Part 3","label":"Questions 56–58","segment":"q56-58","start":1440.85,"end":1521.95,"questions":[56,57,58],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Man (Curtis): Hey Krista, how's your design for the concert hall coming along?","vi":"Curtis: Krista, thiết kế hội trường hòa nhạc của cô tiến triển thế nào?"},{"cls":"t9-bi-row dialogue-row","en":"Woman (Krista): It's going well, Curtis. How are you doing?","vi":"Krista: Tốt lắm Curtis. Còn anh?"},{"cls":"t9-bi-row dialogue-row","en":"Man (Curtis): I'm busy! I don't know if you've heard, but we're going to choose three students from the local university to do <mark class=\"term\" data-ipa=\"/ˈɪntɝːnʃɪps/\" data-meaning=\"chương trình thực tập\" tabindex=\"0\">internships</mark> here this summer. I'm in charge of the program.","vi":"Curtis: Tôi bận lắm! Không biết cô đã nghe chưa, nhưng chúng ta sẽ chọn ba sinh viên từ trường đại học địa phương đến thực tập ở đây mùa hè này. Tôi phụ trách chương trình."},{"cls":"t9-bi-row dialogue-row","en":"Woman (Krista): No, I hadn't heard that. Is there anything I can do to help?","vi":"Krista: Tôi chưa nghe. Tôi có thể giúp gì không?"},{"cls":"t9-bi-row dialogue-row","en":"Man (Curtis): Definitely. As a senior employee, it'd be great if you could give a talk to the students about your work and the skills it requires. Would you be willing to do that sometime in July?","vi":"Curtis: Có chứ. Là nhân viên cấp cao, sẽ rất tuyệt nếu cô nói chuyện với các sinh viên về công việc và kỹ năng cần thiết. Cô có thể làm vào một lúc nào đó trong tháng Bảy không?"},{"cls":"t9-bi-row dialogue-row","en":"Woman (Krista): Sure, I'd be happy to.","vi":"Krista: Được, tôi rất sẵn lòng."}]},{"part":"Part 3","label":"Questions 59–61","segment":"q59-61","start":1515.95,"end":1599.2,"questions":[59,60,61],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Woman: Hi Marcus, where are you right now?","vi":"Người phụ nữ: Marcus, anh đang ở đâu?"},{"cls":"t9-bi-row dialogue-row","en":"Man (Marcus): I'm on the fourth floor, putting up a wall fan for the accountants.","vi":"Marcus: Tôi ở tầng bốn, đang lắp quạt treo tường cho phòng kế toán."},{"cls":"t9-bi-row dialogue-row","en":"Woman: Oh, okay. I'm back from my trip to the hardware store, and I was wondering where you'd gone.","vi":"Người phụ nữ: À. Tôi vừa từ cửa hàng đồ kim khí về và đang thắc mắc anh đi đâu."},{"cls":"t9-bi-row dialogue-row","en":"Man (Marcus): Yeah, the fan was delivered after you left, and they asked me to put it up right away. It's getting warm up here because of the sunlight bouncing off the new skyscraper across the street.","vi":"Marcus: Quạt được giao sau khi cô đi và họ nhờ tôi lắp ngay. Trên này đang nóng vì ánh nắng phản chiếu từ tòa nhà chọc trời mới bên kia đường."},{"cls":"t9-bi-row dialogue-row","en":"Woman: Really? That's too bad. Well, let me know if you need anything.","vi":"Người phụ nữ: Thật sao? Tệ quá. Nếu cần gì thì báo tôi."},{"cls":"t9-bi-row dialogue-row","en":"Man (Marcus): Oh, actually, I left my blue screwdriver on my desk.","vi":"Marcus: À, thực ra tôi để chiếc tua-vít xanh trên bàn làm việc."},{"cls":"t9-bi-row dialogue-row","en":"Woman: Ah, yes, I see it. I'll be there in a minute.","vi":"Người phụ nữ: À, tôi thấy rồi. Tôi sẽ lên đó trong một phút."}]},{"part":"Part 3","label":"Questions 62–64","segment":"q62-64","start":1593.2,"end":1686.7,"questions":[62,63,64],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Woman: Kendrick, I'm concerned about the weather this week. We should probably schedule a few extra employees to repair potential damage to the power lines.","vi":"Người phụ nữ: Kendrick, tôi lo về thời tiết tuần này. Có lẽ chúng ta nên xếp thêm vài nhân viên để sửa những hư hỏng có thể xảy ra với đường dây điện."},{"cls":"t9-bi-row dialogue-row","en":"Man (Kendrick): Why? What's going on?","vi":"Kendrick: Tại sao? Có chuyện gì?"},{"cls":"t9-bi-row dialogue-row","en":"Woman: Well, as you can see on this forecast I printed out, there's going to be one day of high winds. We'll want at least one extra crew per district <mark class=\"term\" data-ipa=\"/ɑːn ˈstændbaɪ/\" data-meaning=\"trực chờ; sẵn sàng\" tabindex=\"0\">on standby</mark> that day, I think.","vi":"Người phụ nữ: Như anh thấy trong bản dự báo tôi in, sẽ có một ngày gió mạnh. Tôi nghĩ hôm đó mỗi khu vực nên có ít nhất một đội bổ sung trực chờ."},{"cls":"t9-bi-row dialogue-row","en":"Man (Kendrick): Hmm, this forecast is from the Clancy Weather Service though, isn't it? They're not always reliable in my experience. Why don't you see what a few other <mark class=\"term\" data-ipa=\"/ˌmiːtiərəˈlɑːdʒɪkəl ˈsɝːvɪsɪz/\" data-meaning=\"dịch vụ khí tượng\" tabindex=\"0\">meteorological services</mark> are predicting? If it's similar, then I'll approve your suggestion.","vi":"Kendrick: Nhưng dự báo này từ Clancy Weather Service, đúng không? Theo kinh nghiệm của tôi họ không phải lúc nào cũng đáng tin. Cô hãy xem vài dịch vụ khí tượng khác dự đoán thế nào. Nếu tương tự thì tôi sẽ phê duyệt đề xuất."}]},{"part":"Part 3","label":"Questions 65–67","segment":"q65-67","start":1680.7,"end":1778.15,"questions":[65,66,67],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Man (Kwang-min Cho): Hi Sonya, it's Kwang-min Cho. I've picked the new gate for my yard.","vi":"Kwang-min Cho: Chào Sonya, tôi đã chọn chiếc cổng mới cho sân rồi."},{"cls":"t9-bi-row dialogue-row","en":"Woman (Sonya): Great! Let me just get your file out. Okay, which one do you want?","vi":"Sonya: Tuyệt! Để tôi lấy hồ sơ của anh. Được rồi, anh muốn mẫu nào?"},{"cls":"t9-bi-row dialogue-row","en":"Man (Kwang-min Cho): I like the one you showed me that is curved at the top and closed at the bottom.","vi":"Kwang-min Cho: Tôi thích mẫu cô cho xem có phần trên cong và phần dưới kín."},{"cls":"t9-bi-row dialogue-row","en":"Woman (Sonya): Good choice! It has an appealing mix of style and functionality.","vi":"Sonya: Lựa chọn hay! Nó kết hợp đẹp giữa kiểu dáng và công năng."},{"cls":"t9-bi-row dialogue-row","en":"Man (Kwang-min Cho): That's what I thought. I want a gate that will make the yard look nice, but that will also keep animals out of the vegetable garden I'm planning.","vi":"Kwang-min Cho: Tôi cũng nghĩ vậy. Tôi muốn cổng làm sân đẹp nhưng đồng thời ngăn động vật vào vườn rau tôi sắp trồng."},{"cls":"t9-bi-row dialogue-row","en":"Woman (Sonya): Absolutely. Now I'll call to make sure the <mark class=\"term\" data-ipa=\"/ˈhoʊlˌseɪlɚ/\" data-meaning=\"nhà bán buôn\" tabindex=\"0\">wholesaler</mark> has it <mark class=\"term\" data-ipa=\"/ɪn stɑːk/\" data-meaning=\"còn hàng\" tabindex=\"0\">in stock</mark>. If it is, the landscaping crew will be able to finish the fencing as scheduled.","vi":"Sonya: Được. Giờ tôi sẽ gọi kiểm tra xem nhà bán buôn còn hàng không. Nếu có, đội cảnh quan sẽ hoàn thành hàng rào đúng lịch."}]},{"part":"Part 3","label":"Questions 68–70","segment":"q68-70","start":1772.15,"end":1865.2,"questions":[68,69,70],"rows":[{"cls":"t9-bi-row dialogue-row","en":"Man: All right, we now have a <mark class=\"term\" data-ipa=\"/fʊl tæŋk əv ɡæs/\" data-meaning=\"bình xăng đầy\" tabindex=\"0\">full tank of gas</mark>. We shouldn't have to stop again unless we want some snacks.","vi":"Người đàn ông: Được rồi, bình xăng giờ đã đầy. Chúng ta không cần dừng nữa trừ khi muốn mua đồ ăn nhẹ."},{"cls":"t9-bi-row dialogue-row","en":"Woman: Great! Well, since there are a few more hours of highway ahead of us, why don't you find something for us to listen to?","vi":"Người phụ nữ: Tuyệt! Vì còn vài giờ chạy cao tốc, anh tìm thứ gì cho chúng ta nghe nhé?"},{"cls":"t9-bi-row dialogue-row","en":"Man: Sure, I just subscribed to a new podcast for this trip, actually. It's a series of interviews with successful entrepreneurs.","vi":"Người đàn ông: Được. Thực ra tôi vừa đăng ký một podcast mới cho chuyến này. Đó là loạt phỏng vấn các doanh nhân thành công."},{"cls":"t9-bi-row dialogue-row","en":"Woman: That sounds good. Maybe we'll get some ideas that we can apply at the <mark class=\"term\" data-ipa=\"/treɪd ʃoʊ/\" data-meaning=\"hội chợ thương mại\" tabindex=\"0\">trade show</mark> tomorrow.","vi":"Người phụ nữ: Nghe hay đấy. Có lẽ chúng ta sẽ có vài ý tưởng áp dụng tại hội chợ thương mại ngày mai."},{"cls":"t9-bi-row dialogue-row","en":"Man: Exactly. Okay, let's see... I'm most interested in the third episode here, but since we have enough time to listen to all of them, I'll just start with the oldest one.","vi":"Người đàn ông: Chính xác. Tôi hứng thú nhất với tập thứ ba, nhưng vì đủ thời gian nghe hết, tôi sẽ bắt đầu từ tập cũ nhất."}]},{"part":"Part 4","label":"Questions 71–73","segment":"q71-73","start":1899.85,"end":1968.05,"questions":[71,72,73],"rows":[{"cls":"t9-bi-row monologue-row","en":"Speaker (Sally Fuller): Hi, my name is Sally Fuller and I'd like to use your <mark class=\"term\" data-ipa=\"/ˈoʊvɚnaɪt dɪˈlɪvɚi/\" data-meaning=\"giao qua đêm\" tabindex=\"0\">overnight delivery</mark> service to send a package.","vi":"Sally Fuller: Xin chào, tôi là Sally Fuller và muốn dùng dịch vụ giao qua đêm để gửi một gói hàng."},{"cls":"t9-bi-row monologue-row","en":"But I'm having a problem. I can't seem to find your storefront.","vi":"Nhưng tôi gặp vấn đề: tôi không tìm thấy cửa hàng."},{"cls":"t9-bi-row monologue-row","en":"My map app says that it's at 650 Jackson Avenue. Is that right?","vi":"Ứng dụng bản đồ nói địa chỉ là 650 Jackson Avenue, có đúng không?"},{"cls":"t9-bi-row monologue-row","en":"Because I'm parked in front of that building now and I don't see your sign anywhere.","vi":"Tôi đang đỗ xe ngay trước tòa nhà đó mà không thấy biển hiệu."},{"cls":"t9-bi-row monologue-row","en":"I know that I need to drop this package off by 11 in order for it to ship overnight, so please call me back at this number as soon as you get this message.","vi":"Tôi biết phải gửi gói trước 11 giờ để có thể giao qua đêm, nên vui lòng gọi lại số này càng sớm càng tốt."},{"cls":"t9-bi-row monologue-row","en":"Thanks.","vi":"Cảm ơn."}]},{"part":"Part 4","label":"Questions 74–76","segment":"q74-76","start":1962.05,"end":2047.1,"questions":[74,75,76],"rows":[{"cls":"t9-bi-row monologue-row","en":"Speaker (Terrence Barnes): This is Terrence Barnes from KTQN News with an announcement regarding traffic in Thornland.","vi":"Terrence Barnes: Đây là Terrence Barnes từ KTQN News với thông báo giao thông ở Thornland."},{"cls":"t9-bi-row monologue-row","en":"A substantial number of citizens and visitors driving to the Wilford Center for tonight's <mark class=\"term\" data-ipa=\"/ˌsoʊld ˈaʊt/\" data-meaning=\"đã bán hết vé\" tabindex=\"0\">sold-out</mark> charity concert is causing serious congestion downtown.","vi":"Rất nhiều người dân và du khách lái xe đến Wilford Center để dự buổi hòa nhạc từ thiện đã bán hết vé tối nay, gây ùn tắc nghiêm trọng ở trung tâm."},{"cls":"t9-bi-row monologue-row","en":"Traffic has slowed to a <mark class=\"term\" data-ipa=\"/ˈstændstɪl/\" data-meaning=\"tình trạng đứng yên\" tabindex=\"0\">standstill</mark> on some streets.","vi":"Một số đường gần như đứng yên."},{"cls":"t9-bi-row monologue-row","en":"In response, officials from the Thornland Department of Transportation have <mark class=\"term\" data-ipa=\"/ˈɪʃuːd ə ˈsteɪtmənt/\" data-meaning=\"đưa ra thông báo\" tabindex=\"0\">issued a statement</mark> on its website. It asks those without urgent business downtown to keep away from the area in order to prevent the situation from growing worse.","vi":"Bộ Giao thông Thornland đã đăng thông báo trên website, yêu cầu những ai không có việc khẩn cấp ở trung tâm tránh khu vực để tình hình không tệ hơn."},{"cls":"t9-bi-row monologue-row","en":"KTQN urges our listeners to do the same.","vi":"KTQN cũng khuyên người nghe làm như vậy."}]},{"part":"Part 4","label":"Questions 77–79","segment":"q77-79","start":2041.1,"end":2136.35,"questions":[77,78,79],"rows":[{"cls":"t9-bi-row monologue-row","en":"Speaker: All right, we're here to discuss the results of last week's focus group testing our new hand lotion.","vi":"Người nói: Chúng ta ở đây để thảo luận kết quả nhóm tập trung tuần trước thử nghiệm kem dưỡng tay mới."},{"cls":"t9-bi-row monologue-row","en":"Jeremy has kindly organized the data into these charts. Thanks, Jeremy!","vi":"Jeremy đã sắp xếp dữ liệu thành các biểu đồ, cảm ơn Jeremy!"},{"cls":"t9-bi-row monologue-row","en":"Now this lotion was developed to provide <mark class=\"term\" data-ipa=\"/ˌlɔːŋ ˈlæstɪŋ/\" data-meaning=\"kéo dài lâu\" tabindex=\"0\">long-lasting</mark> moisturizing, so we had assumed that the advertising would focus on that.","vi":"Sản phẩm được phát triển để dưỡng ẩm lâu, nên ban đầu chúng ta nghĩ quảng cáo sẽ tập trung vào điều đó."},{"cls":"t9-bi-row monologue-row","en":"But really, we need to reflect consumers' actual experience with the product, and as you can see, the scent category received the highest approval rating at 74%.","vi":"Nhưng cần phản ánh trải nghiệm thực tế của người tiêu dùng; mục “mùi hương” nhận tỷ lệ tán thành cao nhất, 74%."},{"cls":"t9-bi-row monologue-row","en":"I know that this change would mean that the marketing team might not have its materials ready by September 25th as planned, but I don't see a problem with moving that due date back a few weeks.","vi":"Thay đổi này có thể khiến đội tiếp thị không kịp tài liệu vào ngày 25 tháng Chín như kế hoạch, nhưng tôi không thấy vấn đề gì nếu lùi hạn vài tuần."},{"cls":"t9-bi-row monologue-row","en":"What do you all think?","vi":"Mọi người nghĩ sao?"}]},{"part":"Part 4","label":"Questions 80–82","segment":"q80-82","start":2130.35,"end":2219.1,"questions":[80,81,82],"rows":[{"cls":"t9-bi-row monologue-row","en":"Speaker: As the summer heat rises, you may find that your shirts, dresses, and suits become dirty and wrinkled more quickly.","vi":"Người nói: Khi cái nóng mùa hè tăng lên, áo sơ mi, váy và vest có thể bẩn và nhăn nhanh hơn."},{"cls":"t9-bi-row monologue-row","en":"If you don't have hours to spend in the laundry room, try Zantry Cleaners!","vi":"Nếu không có hàng giờ ở phòng giặt, hãy thử Zantry Cleaners!"},{"cls":"t9-bi-row monologue-row","en":"We'll wash or dry clean your apparel carefully to ensure that colors stay bright and fabrics stay strong.","vi":"Chúng tôi giặt hoặc giặt khô quần áo cẩn thận để giữ màu tươi và vải bền."},{"cls":"t9-bi-row monologue-row","en":"And for even more convenience, you can now have your items <mark class=\"term\" data-ipa=\"/pɪkt ʌp ænd drɑːpt ɔːf/\" data-meaning=\"được lấy và giao tận nơi\" tabindex=\"0\">picked up and dropped off</mark> right at your door.","vi":"Để tiện hơn, giờ bạn có thể được lấy và giao đồ ngay tại cửa."},{"cls":"t9-bi-row monologue-row","en":"Customers can try this great new service once for free as part of a special offer.","vi":"Khách hàng được thử dịch vụ mới này một lần miễn phí trong chương trình đặc biệt."},{"cls":"t9-bi-row monologue-row","en":"Simply download Zantry Go, our convenient app for smartphones, and the offer will be automatically applied to your first order.","vi":"Chỉ cần tải Zantry Go, ứng dụng điện thoại của chúng tôi, ưu đãi sẽ tự động áp dụng cho đơn đầu tiên."},{"cls":"t9-bi-row monologue-row","en":"Do it today to stay fresh throughout the summer!","vi":"Hãy làm ngay hôm nay để luôn tươi mới suốt mùa hè!"}]},{"part":"Part 4","label":"Questions 83–85","segment":"q83-85","start":2213.1,"end":2305.75,"questions":[83,84,85],"rows":[{"cls":"t9-bi-row monologue-row","en":"Speaker: Welcome back to Everyday Parenting on WTUY Radio.","vi":"Người nói: Chào mừng quay lại Everyday Parenting trên WTUY Radio."},{"cls":"t9-bi-row monologue-row","en":"Before the break, I was talking to Byron Young about his popular blog, \"While We're Young\", which is full of humorous and heartfelt writings about his children.","vi":"Trước giờ nghỉ, tôi đã nói chuyện với Byron Young về blog nổi tiếng “While We’re Young”, đầy những bài viết hài hước và chân thành về các con."},{"cls":"t9-bi-row monologue-row","en":"Now it's your turn to talk to Mr. Young.","vi":"Giờ đến lượt bạn trò chuyện với ông Young."},{"cls":"t9-bi-row monologue-row","en":"Call us now at 555-0139 with your <mark class=\"term\" data-ipa=\"/ˈbɝːnɪŋ ˈkwɛstʃənz/\" data-meaning=\"những câu hỏi cấp thiết\" tabindex=\"0\">burning questions</mark> about parenting.","vi":"Hãy gọi 555-0139 với những câu hỏi nóng hổi về nuôi dạy con."},{"cls":"t9-bi-row monologue-row","en":"Remember, he's a full- time parent to three kids, so you can ask him about anything—sleep issues, fights between siblings, problems adjusting to school... he's dealt with it all!","vi":"Hãy nhớ ông ấy là phụ huynh toàn thời gian của ba đứa trẻ, nên bạn có thể hỏi bất cứ điều gì: giấc ngủ, anh chị em cãi nhau, khó thích nghi ở trường... ông ấy đã trải qua tất cả!"}]},{"part":"Part 4","label":"Questions 86–88","segment":"q86-88","start":2299.75,"end":2387.5,"questions":[86,87,88],"rows":[{"cls":"t9-bi-row monologue-row","en":"Speaker: Thank you for watching this tutorial on Lawnda, the mobile app that helps you <mark class=\"term\" data-ipa=\"/træk jʊr ˈspɛndɪŋ/\" data-meaning=\"theo dõi chi tiêu\" tabindex=\"0\">track your spending</mark> and <mark class=\"term\" data-ipa=\"/ˈbæləns jʊr ˈpɝːsənəl ˈbʌdʒɪt/\" data-meaning=\"cân đối ngân sách cá nhân\" tabindex=\"0\">balance your personal budget</mark>.","vi":"Người nói: Cảm ơn bạn đã xem hướng dẫn về Lawnda, ứng dụng di động giúp theo dõi chi tiêu và cân đối ngân sách cá nhân."},{"cls":"t9-bi-row monologue-row","en":"Let's start with the basics.","vi":"Bắt đầu với điều cơ bản."},{"cls":"t9-bi-row monologue-row","en":"When you open up Lawnda for the first time, you'll need to create a user account by linking accounts, cards, and so on from any banks you choose.","vi":"Lần đầu mở Lawnda, bạn cần tạo tài khoản bằng cách liên kết tài khoản ngân hàng, thẻ và các thông tin khác từ những ngân hàng bạn chọn."},{"cls":"t9-bi-row monologue-row","en":"This may sound complicated, but Lawnda is designed to be simple.","vi":"Nghe có vẻ phức tạp nhưng Lawnda được thiết kế để đơn giản."},{"cls":"t9-bi-row monologue-row","en":"Just enter the requested information like this, and you can complete setup pretty quickly.","vi":"Chỉ cần nhập thông tin được yêu cầu như thế này và bạn có thể hoàn tất thiết lập khá nhanh."},{"cls":"t9-bi-row monologue-row","en":"One clear advantage of Lawnda that you can see at this stage is that it supports a long list of banks. Lawnda can collect and organize details about funds and transactions from all these institutions.","vi":"Một ưu điểm rõ ràng là Lawnda hỗ trợ danh sách dài các ngân hàng và có thể thu thập, sắp xếp chi tiết về tiền và giao dịch từ tất cả các tổ chức đó."}]},{"part":"Part 4","label":"Questions 89–91","segment":"q89-91","start":2381.5,"end":2466.2,"questions":[89,90,91],"rows":[{"cls":"t9-bi-row monologue-row","en":"Speaker (Valerie Fleming): Hi Mr. Stevens, my name is Valerie Fleming.","vi":"Valerie Fleming: Chào ông Stevens, tôi là Valerie Fleming."},{"cls":"t9-bi-row monologue-row","en":"I saw your internet ad for your used car.","vi":"Tôi thấy quảng cáo trên Internet về chiếc xe cũ của ông."},{"cls":"t9-bi-row monologue-row","en":"I just moved into town, and I'm having trouble getting around just by bus. It's like the times on the bus schedules are just suggestions!","vi":"Tôi mới chuyển đến thị trấn và đi lại chỉ bằng xe buýt khá khó khăn; giờ trên lịch xe buýt cứ như chỉ để tham khảo!"},{"cls":"t9-bi-row monologue-row","en":"Anyway, I'm so interested in buying your car, but I have a question about it. Can the seats be adjusted electronically?","vi":"Tôi rất muốn mua xe nhưng có một câu hỏi: ghế có điều chỉnh điện được không?"},{"cls":"t9-bi-row monologue-row","en":"I found that that tends to allow a much more comfortable ride.","vi":"Tôi thấy như vậy thường cho cảm giác ngồi thoải mái hơn nhiều."},{"cls":"t9-bi-row monologue-row","en":"So please call me back and let me know.","vi":"Vui lòng gọi lại cho tôi."},{"cls":"t9-bi-row monologue-row","en":"I'm going to be trying out another car around 7 this evening, but otherwise I should be able to answer the phone immediately.","vi":"Khoảng 7 giờ tối nay tôi sẽ đi lái thử một chiếc xe khác, còn ngoài thời gian đó tôi có thể nghe máy ngay."},{"cls":"t9-bi-row monologue-row","en":"Thanks.","vi":"Cảm ơn."}]},{"part":"Part 4","label":"Questions 92–94","segment":"q92-94","start":2460.2,"end":2547.1,"questions":[92,93,94],"rows":[{"cls":"t9-bi-row monologue-row","en":"Speaker: Thank you for the warm welcome.","vi":"Người nói: Cảm ơn sự chào đón nồng nhiệt."},{"cls":"t9-bi-row monologue-row","en":"I am honored to be taking over as <mark class=\"term\" data-ipa=\"/ˈɪntərɪm ˌsiː iː ˈoʊ/\" data-meaning=\"CEO tạm quyền\" tabindex=\"0\">interim CEO</mark> until a permanent replacement for Ms. Riley can be found.","vi":"Tôi rất vinh dự đảm nhiệm vị trí CEO tạm quyền cho đến khi tìm được người thay thế lâu dài cho cô Riley."},{"cls":"t9-bi-row monologue-row","en":"Now, given the circumstances of my appointment, I want to assure you that I will not be making any major changes to our overall direction and practices.","vi":"Với hoàn cảnh bổ nhiệm hiện tại, tôi muốn đảm bảo rằng mình sẽ không thực hiện thay đổi lớn nào đối với định hướng và cách làm chung."},{"cls":"t9-bi-row monologue-row","en":"However, I will make an effort to <mark class=\"term\" data-ipa=\"/fəˈsɪləteɪt ði ɪksˈtʃeɪndʒ/\" data-meaning=\"tạo điều kiện cho việc trao đổi\" tabindex=\"0\">facilitate the exchange</mark> of information and ideas between staff in different areas of the company.","vi":"Tuy nhiên, tôi sẽ cố gắng thúc đẩy việc trao đổi thông tin và ý tưởng giữa nhân viên ở các bộ phận khác nhau."},{"cls":"t9-bi-row monologue-row","en":"This will give us a solid basis of trust as we enter the next era of Shoreman Industries.","vi":"Điều này sẽ tạo nền tảng tin cậy vững chắc khi Shoreman Industries bước vào giai đoạn mới."},{"cls":"t9-bi-row monologue-row","en":"All right, now it's time to hear from you.","vi":"Giờ tôi muốn nghe từ mọi người."},{"cls":"t9-bi-row monologue-row","en":"Please ask me anything you'd like to know about my or the company's plans.","vi":"Hãy hỏi bất cứ điều gì về kế hoạch của tôi hoặc của công ty."}]},{"part":"Part 4","label":"Questions 95–97","segment":"q95-97","start":2541.1,"end":2637.45,"questions":[95,96,97],"rows":[{"cls":"t9-bi-row monologue-row","en":"Speaker: I appreciate your letting me speak to you about the advantages of choosing Valand for your <mark class=\"term\" data-ipa=\"/ˈvɪdioʊ ˈhoʊstɪŋ/\" data-meaning=\"lưu trữ video\" tabindex=\"0\">video hosting</mark> needs.","vi":"Người nói: Cảm ơn đã cho tôi cơ hội trình bày lợi ích của Valand cho nhu cầu lưu trữ video."},{"cls":"t9-bi-row monologue-row","en":"I know that you have been making videos on how to care for the trees, bushes, and flowers that you sell.","vi":"Tôi biết các bạn đang làm video hướng dẫn chăm sóc cây, bụi cây và hoa mà cửa hàng bán."},{"cls":"t9-bi-row monologue-row","en":"Well, you won't find a better way to make those videos available on the web than Valand.","vi":"Không có cách nào tốt hơn Valand để đưa các video đó lên web."},{"cls":"t9-bi-row monologue-row","en":"Our platform is straightforward, fast, and reliable, and all of our service packages allow you to include links to other pages in your videos. That's a great way to engage viewers!","vi":"Nền tảng đơn giản, nhanh và đáng tin cậy; tất cả gói dịch vụ đều cho phép chèn liên kết đến các trang khác vào video, một cách tuyệt vời để thu hút người xem."},{"cls":"t9-bi-row monologue-row","en":"Now, since you've already made over a hundred videos, I want to recommend our package that has a 500-video limit.","vi":"Vì các bạn đã làm hơn một trăm video, tôi đề x <script id="v26-patch-js">
(function(){
  function partForQuestion(n){return n<=6?'Part 1':n<=31?'Part 2':n<=70?'Part 3':'Part 4'}
  function indexWithinPart(n){const p=partForQuestion(n); const arr=UNITS.filter(u=>u.part===p); return Math.max(0,arr.findIndex(u=>u.questions.includes(n)))}
  function jumpToQuestion(n){
    hidePop();
    const targetPart=partForQuestion(n);
    if(mode==='study'){
      part=targetPart; page=indexWithinPart(n); renderStudy(); render(); closeBar();
      return;
    }
    if(part==='all' || part!==targetPart){ part=targetPart; render(); }
    closeBar();
    requestAnimationFrame(()=>{ const el=document.querySelector(`[data-qcard="${n}"]`); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); });
  }
  function centerPop(html){const p=$('#pop'); $('#popbody').innerHTML=html; p.style.left='50%'; p.style.top='max(12px, env(safe-area-inset-top))'; p.style.transform='translateX(-50%)'; p.classList.add('show');}
  const oldHide=hidePop; hidePop=function(){ const p=$('#pop'); p.style.transform=''; oldHide(); }
  function buildQuestionsMenu(){
    const groups=[['Part 1',1,6],['Part 2',7,31],['Part 3',32,70],['Part 4',71,100]];
    return `<div class="qmenu-panel"><div class="qmenu-title">Bảng câu hỏi</div>${groups.map(([label,a,b])=>`<div class="qmenu-sub">${label}</div><div class="qmenu-grid">${Array.from({length:b-a+1},(_,i)=>a+i).map(n=>`<button class="${responses[n]?'done':''} ${partForQuestion(n)===part?'active-part':''}" data-jumpq="${n}">${n}</button>`).join('')}</div>`).join('')}</div>`;
  }
  function buildPartMenu(){
    return `<div class="qmenu-panel"><div class="qmenu-title">Làm từng Part</div><div class="part-grid">${['Part 1','Part 2','Part 3','Part 4'].map(p=>`<button class="${part===p?'active-part':''}" data-selectpart="${p}">${p}</button>`).join('')}</div></div>`;
  }
  unitQuestionHTML=function(u){
    let out='';
    for(const n of u.questions){ if(n<32) continue; const q=qmap(n); if(!q) continue; const letters=Object.keys(q.options);
      const optsEn=letters.map((L,i)=>`<div class="opt ${KEY[n]===L?'correct':''}"><b>(${L})</b> ${q.options[L]}</div>`).join('');
      const optsVi=letters.map((L,i)=>`<div class="opt ${KEY[n]===L?'correct':''}"><b>(${L})</b> ${q.viOptions[i]||''}</div>`).join('');
      out+=`<div class="study-q">${visual(n)?`<div class="graphic-span">${visual(n)}</div>`:''}<div class="qside"><div class="qstem">${n}. ${q.stem}</div><div class="opts">${optsEn}</div></div><div class="qside"><div class="qstem">${n}. ${q.viStem||''}</div><div class="opts">${optsVi}</div></div></div>`;
    }
    return out?`<div class="study-q-wrap">${out}</div>`:'';
  };
  studyUnit2=function(u,idx){
    let ens='',vis='';
    for(const r of u.rows){ if(r.cls.includes('question-row')) continue; let en=r.en,vi=r.vi; const text=(new DOMParser().parseFromString(en,'text/html').body.textContent||'').trim(); const mo=text.match(/^([A-D])\./); const cls=(mo&&KEY[u.questions[0]]===mo[1])?' style="outline:2px solid #22c55e;background:#f0fdf4"':''; ens+=`<div class="cell en-cell"${cls}>${en}</div>`; vis+=`<div class="cell vi-cell"${cls}>${vi}</div>`;}
    const img=(u.part==='Part 1'&&P1[String(u.questions[0])])?`<img class="part1-photo" src="${P1[String(u.questions[0])]}">`:'';
    return `<section class="unit" data-seg="${u.segment}" data-idx="${idx}"><header class="head"><span class="part">${u.part}</span><span class="title">${u.label}</span><div class="audio-controls"><button data-skip="-5">−5s</button><button class="play" data-play>▶ Phát</button><button data-skip="5">+5s</button><span class="time">${fmt(u.start)} / ${fmt(u.end)}</span></div></header>${img}<div class="frame"><div class="bi"><section class="pane en-pane">${ens}</section><section class="pane vi-pane">${vis}</section></div>${unitQuestionHTML(u)}</div></section>`;
  };
  renderStudy=function(){ const arr=getStudyUnits(); if(part!=='all')page=Math.min(page,Math.max(0,arr.length-1)); const show=part==='all'?arr:[arr[page]].filter(Boolean); content.innerHTML=show.map(u=>studyUnit2(u,UNITS.indexOf(u))).join(''); $('#pagerPrev').classList.toggle('hidden',part==='all'); $('#pagerNext').classList.toggle('hidden',part==='all'); restoreEdits(); }
  examCard=function(n){ if(n<=6){return `<div class="exam-card exam-p1" data-qcard="${n}"><div class="qnum">Question ${n}</div><img class="part1-photo" src="${P1[String(n)]}"><div class="exam-options">${['A','B','C','D'].map(L=>examChoice(n,L,'')).join('')}</div></div>`} if(n<=31){return `<div class="exam-card exam-p2" data-qcard="${n}"><div class="qnum">Question ${n}</div><div class="exam-options">${['A','B','C'].map(L=>examChoice(n,L,'')).join('')}</div></div>`} const q=qmap(n); return `<div class="exam-card" data-qcard="${n}">${visual(n)?`<div class="visual-wrap">${visual(n)}</div>`:''}<div class="qnum">${n}. ${q.stem}</div><div class="exam-options">${Object.entries(q.options).map(([L,t])=>examChoice(n,L,t)).join('')}</div></div>` }
  renderExam=function(){ const nums=part==='all'?numsForPart('all'):numsForPart(part); content.innerHTML=`<div class="exam-shell"><div class="part-audio"><b>${part==='all'?'Full Test':part}</b><button class="play" data-partplay>▶ Phát</button><button data-partpause>❚❚ Tạm dừng</button><button data-partreset>↺ Từ đầu</button></div>${nums.map(examCard).join('')}</div>`; $('#pagerPrev').classList.add('hidden'); $('#pagerNext').classList.add('hidden'); }
  $('#questionsBtn').onclick=()=>centerPop(buildQuestionsMenu());
  $('#partJump').onclick=()=>centerPop(buildPartMenu());
  document.addEventListener('click',function(e){ const jq=e.target.closest('[data-jumpq]'); if(jq){ jumpToQuestion(Number(jq.dataset.jumpq)); return; } const sp=e.target.closest('[data-selectpart]'); if(sp){ hidePop(); setPart(sp.dataset.selectpart); return; } });
  render();
})();
</script>

<script id="v27-layout-fix-js">
(function(){
  function paneQuestions(u, lang){
    if(!u.questions || !u.questions.some(n=>n>=32)) return '';
    let out='';
    for(const n of u.questions){
      if(n<32) continue;
      const q=qmap(n); if(!q) continue;
      const letters=Object.keys(q.options);
      const stem=lang==='en' ? q.stem : (q.viStem||'');
      const opts=letters.map((L,i)=>{
        const t=lang==='en' ? q.options[L] : (q.viOptions[i]||'');
        return `<div class="opt ${KEY[n]===L?'correct':''}"><b>(${L})</b> ${t}</div>`;
      }).join('');
      const g=visual(n) ? `<div class="visual-wrap">${visual(n)}</div>` : '';
      out += `<section class="study-pane-question">${g}<div class="qstem">${n}. ${stem}</div><div class="opts">${opts}</div></section>`;
    }
    return out ? `<div class="study-pane-questions">${out}</div>` : '';
  }

  studyUnit2=function(u,idx){
    let ens='',vis='';
    for(const r of u.rows){
      if(r.cls.includes('question-row')) continue;
      const en=r.en, vi=r.vi;
      const text=(new DOMParser().parseFromString(en,'text/html').body.textContent||'').trim();
      const mo=text.match(/^([A-D])\./);
      const cls=(mo&&KEY[u.questions[0]]===mo[1])?' style="outline:2px solid #22c55e;background:#f0fdf4"':'';
      ens+=`<div class="cell en-cell"${cls}>${en}</div>`;
      vis+=`<div class="cell vi-cell"${cls}>${vi}</div>`;
    }
    ens += paneQuestions(u,'en');
    vis += paneQuestions(u,'vi');
    const img=(u.part==='Part 1'&&P1[String(u.questions[0])])?`<img class="part1-photo" src="${P1[String(u.questions[0])]}">`:'';
    return `<section class="unit" data-seg="${u.segment}" data-idx="${idx}"><header class="head"><span class="part">${u.part}</span><span class="title">${u.label}</span><div class="audio-controls"><button data-skip="-5">−5s</button><button class="play" data-play>▶ Phát</button><button data-skip="5">+5s</button><span class="time">${fmt(u.start)} / ${fmt(u.end)}</span></div></header>${img}<div class="frame"><div class="bi"><section class="pane en-pane">${ens}</section><section class="pane vi-pane">${vis}</section></div></div></section>`;
  };

  renderStudy=function(){
    const arr=getStudyUnits();
    if(part!=='all') page=Math.min(page,Math.max(0,arr.length-1));
    const show=part==='all'?arr:[arr[page]].filter(Boolean);
    content.innerHTML=show.map(u=>studyUnit2(u,UNITS.indexOf(u))).join('');
    $('#pagerPrev').classList.toggle('hidden',part==='all');
    $('#pagerNext').classList.toggle('hidden',part==='all');
    restoreEdits();
  };

  function examSetForUnit(u){
    const qs=(u.questions||[]).filter(n=>n>=32);
    if(!qs.length) return '';
    const first=qs[0], last=qs[qs.length-1];
    return `<section class="exam-set"><div class="exam-set-head">Questions ${first}–${last}</div><div class="exam-set-body">${qs.map(examCard).join('')}</div></section>`;
  }

  renderExam=function(){
    let body='';
    if(part==='Part 3' || part==='Part 4'){
      body=UNITS.filter(u=>u.part===part).map(examSetForUnit).join('');
    }else if(part==='all'){
      body=numsForPart('all').map(examCard).join('');
    }else{
      body=numsForPart(part).map(examCard).join('');
    }
    content.innerHTML=`<div class="exam-shell"><div class="part-audio"><b>${part==='all'?'Full Test':part}</b><button class="play" data-partplay>▶ Phát</button><button data-partpause>❚❚ Tạm dừng</button><button data-partreset>↺ Từ đầu</button></div>${body}</div>`;
    $('#pagerPrev').classList.add('hidden');
    $('#pagerNext').classList.add('hidden');
  };

  render();
})();
</script>

<script id="v29-alignment-menu-js">
(function(){
  function qPart(n){ return n<=6?'Part 1':n<=31?'Part 2':n<=70?'Part 3':'Part 4'; }
  function unitForElement(el){
    const uel=el && el.closest ? el.closest('.unit') : null;
    if(!uel) return null;
    const idx=Number(uel.dataset.idx);
    return Number.isInteger(idx) ? UNITS[idx] : null;
  }
  function visibleStudyQuestions(){
    const units=[...document.querySelectorAll('.unit')];
    if(!units.length) return [];
    let best=null,bestScore=Infinity;
    const anchor=70;
    units.forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.bottom<0 || r.top>innerHeight) return;
      const score=Math.abs(r.top-anchor);
      if(score<bestScore){bestScore=score;best=el;}
    });
    const u=unitForElement(best||units[0]);
    return u?.questions ? [...u.questions] : [];
  }
  function questionButtonClass(n){
    if(mode==='exam'){
      if(!responses[n]) return '';
      if(submitted) return responses[n]===KEY[n] ? 'exam-answered exam-correct' : 'exam-answered exam-wrong';
      return 'exam-answered';
    }
    const current=visibleStudyQuestions();
    return current.includes(n) ? 'study-current' : '';
  }
  function compactQuestionMenuHTML(){
    const groups=[['Part 1',1,6],['Part 2',7,31],['Part 3',32,70],['Part 4',71,100]];
    return `<div class="qmenu-panel"><div class="qmenu-title">Bảng câu hỏi</div>${groups.map(([label,a,b])=>
      `<div class="qmenu-sub">${label}</div><div class="qmenu-grid">${Array.from({length:b-a+1},(_,i)=>a+i).map(n=>
        `<button class="${questionButtonClass(n)}" data-v29jump="${n}">${n}</button>`).join('')}</div>`
    ).join('')}</div>`;
  }
  function openCompactQuestionMenu(){
    const p=$('#pop');
    $('#popbody').innerHTML=compactQuestionMenuHTML();
    p.classList.add('v29-qmenu');
    p.style.left='50%'; p.style.top='max(12px, env(safe-area-inset-top))'; p.style.transform='translateX(-50%)';
    p.classList.add('show');
  }
  function closeQMenu(){
    const p=$('#pop'); p.classList.remove('v29-qmenu'); p.style.transform=''; hidePop();
  }
  function unitIndexForQuestion(n){
    const p=qPart(n), arr=UNITS.filter(u=>u.part===p);
    return Math.max(0,arr.findIndex(u=>u.questions.includes(n)));
  }
  function jumpTo(n){
    closeQMenu();
    const p=qPart(n);
    if(mode==='study'){
      part=p; page=unitIndexForQuestion(n); render(); closeBar(); return;
    }
    if(part!==p){ part=p; render(); }
    closeBar();
    requestAnimationFrame(()=>document.querySelector(`[data-qcard="${n}"]`)?.scrollIntoView({behavior:'smooth',block:'start'}));
  }
  $('#questionsBtn').onclick=openCompactQuestionMenu;
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-v29jump]');
    if(b){ e.preventDefault(); jumpTo(Number(b.dataset.v29jump)); }
  });

  function clearSyncedHeights(root){
    root.querySelectorAll('.en-pane>.cell,.vi-pane>.cell,.en-pane>.study-pane-questions>.study-pane-question,.vi-pane>.study-pane-questions>.study-pane-question').forEach(el=>{
      el.style.minHeight=''; el.style.height='';
    });
  }
  function syncPairs(root){
    if(!matchMedia('(orientation: landscape)').matches){ clearSyncedHeights(root); return; }
    clearSyncedHeights(root);
    root.querySelectorAll('.unit').forEach(unit=>{
      const enCells=[...unit.querySelectorAll('.en-pane > .cell')];
      const viCells=[...unit.querySelectorAll('.vi-pane > .cell')];
      const count=Math.min(enCells.length,viCells.length);
      for(let i=0;i<count;i++){
        const h=Math.ceil(Math.max(enCells[i].getBoundingClientRect().height,viCells[i].getBoundingClientRect().height));
        enCells[i].style.minHeight=h+'px'; viCells[i].style.minHeight=h+'px';
      }
      const enQs=[...unit.querySelectorAll('.en-pane > .study-pane-questions > .study-pane-question')];
      const viQs=[...unit.querySelectorAll('.vi-pane > .study-pane-questions > .study-pane-question')];
      const qcount=Math.min(enQs.length,viQs.length);
      for(let i=0;i<qcount;i++){
        const h=Math.ceil(Math.max(enQs[i].getBoundingClientRect().height,viQs[i].getBoundingClientRect().height));
        enQs[i].style.minHeight=h+'px'; viQs[i].style.minHeight=h+'px';
      }
    });
  }
  let raf=0;
  function scheduleSync(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>syncPairs(document)); }
  const originalRenderStudy=renderStudy;
  renderStudy=function(){ originalRenderStudy(); scheduleSync(); };
  const originalRender=render;
  render=function(){ originalRender(); if(mode==='study') scheduleSync(); };
  window.addEventListener('resize',scheduleSync,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(scheduleSync,120));
  new MutationObserver(()=>{ if(mode==='study') scheduleSync(); }).observe(content,{childList:true,subtree:true});
  scheduleSync();
})();
</script>

<script id="v31-s25-edge-popup-js">
(function(){
  const pop=document.getElementById('pop');
  const popBody=document.getElementById('popbody');

  /* showPop is used by vocabulary, saved comments and translation results.
     Force those informational popups into a fixed bottom sheet. */
  window.showPop = showPop = function(h,x,y){
    if(!pop || !popBody) return;
    pop.classList.remove('v29-qmenu');
    pop.classList.add('bottom-info');
    popBody.innerHTML=h;
    pop.style.left='0';
    pop.style.right='0';
    pop.style.top='auto';
    pop.style.bottom='0';
    pop.style.transform='none';
    pop.classList.add('show');
  };

  const priorHide = window.hidePop || hidePop;
  window.hidePop = hidePop = function(){
    if(pop){
      pop.classList.remove('show','bottom-info');
      pop.style.bottom='';
      pop.style.right='';
      pop.style.left='';
      pop.style.top='';
      pop.style.transform='';
    }
  };

  /* Existing close button was bound before V31; also clean V31 state afterwards. */
  pop?.querySelector('.close')?.addEventListener('click',()=>{
    pop.classList.remove('bottom-info');
    pop.style.bottom='';
    pop.style.right='';

  /* Question/Part menus use the compact selector instead of the bottom sheet. */
  ['questionsBtn','partJump'].forEach(id=>{

      pop?.classList.remove('bottom-info');
      if(pop){ pop.style.bottom=''; pop.style.right=''; }

  });

  /* Keep the viewport flush after rotation / dynamic browser UI changes. */
  function edge(){
    document.documentElement.style.width='100vw';

    document.documentElement.style.minHeight='100dvh';
    document.body.style.width='100vw';

  }
  edge();

})();

  .en-pane > .cell,
  .vi-pane > .cell,
  .en-pane > .study-pane-questions > .study-pane-question,
  .vi-pane > .study-pane-questions > .study-pane-question{
    box-sizing:border-box!important;
  }

</style>

<script id="v36-exact-bilingual-sync-js">
(function(){
  let syncing=false, rafA=0, rafB=0, timerA=0, timerB=0;

  function allPairs(unit){
    const pairs=[];
    const enCells=[...unit.querySelectorAll('.en-pane > .cell')];
    const viCells=[...unit.querySelectorAll('.vi-pane > .cell')];
    for(let i=0;i<Math.min(enCells.length,viCells.length);i++) pairs.push([enCells[i],viCells[i]]);

    const enQs=[...unit.querySelectorAll('.en-pane > .study-pane-questions > .study-pane-question')];
    const viQs=[...unit.querySelectorAll('.vi-pane > .study-pane-questions > .study-pane-question')];
    for(let i=0;i<Math.min(enQs.length,viQs.length);i++) pairs.push([enQs[i],viQs[i]]);
    return pairs;
  }

  function resetExact(root=document){
    root.querySelectorAll(
      '.en-pane > .cell,.vi-pane > .cell,'+
      '.en-pane > .study-pane-questions > .study-pane-question,'+
      '.vi-pane > .study-pane-questions > .study-pane-question'
    ).forEach(el=>{
      el.style.height='';
      el.style.minHeight='';
      el.style.boxSizing='border-box';
    });
  }

  function syncExact(){
    if(syncing) return;
    syncing=true;
    try{
      if(!matchMedia('(orientation: landscape)').matches){
        resetExact(document);
        return;
      }
      resetExact(document);

      document.querySelectorAll('.unit').forEach(unit=>{
        const pairs=allPairs(unit);

        /* Read all natural sizes before writing any height. */
        const sizes=pairs.map(([a,b])=>Math.ceil(Math.max(
          a.getBoundingClientRect().height,
          b.getBoundingClientRect().height
        )));

        pairs.forEach(([a,b],i)=>{
          const h=sizes[i]+'px';
          a.style.height=h;
          b.style.height=h;
          a.style.minHeight=h;
          b.style.minHeight=h;
        });
      });
    }finally{
      syncing=false;
    }
  }

  function scheduleExact(){
    cancelAnimationFrame(rafA);
    cancelAnimationFrame(rafB);
    clearTimeout(timerA);
    clearTimeout(timerB);

    rafA=requestAnimationFrame(()=>{
      rafB=requestAnimationFrame(syncExact);
    });
    timerA=setTimeout(syncExact,120);
    timerB=setTimeout(syncExact,420);
  }

  /* The old V29 synchronizer used min-height. Running this later with exact
     heights makes V36 authoritative without changing the study data. */
  window.addEventListener('load',scheduleExact,{passive:true});
  window.addEventListener('resize',scheduleExact,{passive:true});
  window.addEventListener('orientationchange',()=>{
    resetExact(document);
    setTimeout(scheduleExact,100);
  },{passive:true});

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(scheduleExact).catch(()=>{});
  }

  document.addEventListener('load',e=>{
    if(e.target && e.target.tagName==='IMG') scheduleExact();
  },true);

  const content=document.getElementById('content');
  if(content){
    new MutationObserver(()=>scheduleExact()).observe(content,{childList:true,subtree:true});
  }

  /* Re-sync after any study navigation click, because render() replaces DOM. */
  document.addEventListener('click',e=>{
    if(e.target.closest(
      '[data-play],[data-skip],#pagerPrev,#pagerNext,#questionsBtn,#partJump,'+
      '[data-v29jump],[data-jumpq],[data-selectpart],[data-part]'
    )){
      setTimeout(scheduleExact,30);
    }
  },true);

  scheduleExact();
})();
</script>

.t9-portrait-stacked{display:block}

    display:block!important;

  .t9-portrait-stacked{display:none!important}

<script id="v37-structural-bilingual-grid-js">
(function(){
  function qPairRows(u){
    if(!u.questions || !u.questions.some(n=>n>=32)) return '';
    let out='';
    for(const n of u.questions){
      if(n<32) continue;
      const q=qmap(n); if(!q) continue;
      const letters=Object.keys(q.options);
      const graphic=visual(n);

      out += `<section class="t9-qgroup" data-paired-question="${n}">`;
      if(graphic){
        out += `<div class="t9-qgraphic">${graphic}</div>`;
      }

      out += `<div class="t9-pair-row t9-qstem-row">`
        + `<div class="t9-pair-cell t9-qstem-cell">${n}. ${q.stem}</div>`
        + `<div class="t9-pair-cell vi t9-qstem-cell">${n}. ${q.viStem||''}</div>`
        + `</div>`;

      letters.forEach((L,i)=>{
        const correct=KEY[n]===L ? ' correct' : '';
        out += `<div class="t9-pair-row t9-option-row" data-option="${L}">`
          + `<div class="t9-pair-cell t9-opt-cell"><div class="t9-opt-inner${correct}"><b>(${L})</b> ${q.options[L]}</div></div>`
          + `<div class="t9-pair-cell vi t9-opt-cell"><div class="t9-opt-inner${correct}"><b>(${L})</b> ${q.viOptions[i]||''}</div></div>`
          + `</div>`;
      });
      out += `</section>`;
    }
    return out;
  }

  function portraitQuestions(u,lang){
    if(!u.questions || !u.questions.some(n=>n>=32)) return '';
    let out='';
    for(const n of u.questions){
      if(n<32) continue;
      const q=qmap(n); if(!q) continue;
      const letters=Object.keys(q.options);
      const stem=lang==='en'?q.stem:(q.viStem||'');
      const graphic=visual(n);
      out += `<section class="study-pane-question">`
        + (graphic?`<div class="visual-wrap">${graphic}</div>`:'')
        + `<div class="qstem">${n}. ${stem}</div><div class="opts">`;
      letters.forEach((L,i)=>{
        const t=lang==='en'?q.options[L]:(q.viOptions[i]||'');
        out += `<div class="opt ${KEY[n]===L?'correct':''}"><b>(${L})</b> ${t}</div>`;
      });
      out += `</div></section>`;
    }
    return out?`<div class="study-pane-questions">${out}</div>`:'';
  }

  function studyUnitV37(u,idx){
    let en='',vi='',pairs='';

    for(const r of u.rows){
      if(r.cls.includes('question-row')) continue;

      const plain=(new DOMParser().parseFromString(r.en,'text/html').body.textContent||'').trim();
      const mo=plain.match(/^([A-D])\./);
      const isCorrect=mo && KEY[u.questions[0]]===mo[1];
      const correctStyle=isCorrect?' style="outline:2px solid #22c55e;background:#f0fdf4"':'';

      en += `<div class="cell en-cell"${correctStyle}>${r.en}</div>`;
      vi += `<div class="cell vi-cell"${correctStyle}>${r.vi}</div>`;

      pairs += `<div class="t9-pair-row">`
        + `<div class="t9-pair-cell"${correctStyle}>${r.en}</div>`
        + `<div class="t9-pair-cell vi"${correctStyle}>${r.vi}</div>`
        + `</div>`;
    }

    en += portraitQuestions(u,'en');
    vi += portraitQuestions(u,'vi');
    pairs += qPairRows(u);

    const img=(u.part==='Part 1' && P1[String(u.questions[0])])
      ? `<img class="part1-photo" src="${P1[String(u.questions[0])]}">`
      : '';

    return `<section class="unit" data-seg="${u.segment}" data-idx="${idx}">`
      + `<header class="head"><span class="part">${u.part}</span><span class="title">${u.label}</span>`
      + `<div class="audio-controls"><button data-skip="-5">−5s</button><button class="play" data-play>▶ Phát</button>`
      + `<button data-skip="5">+5s</button><span class="time">${fmt(u.start)} / ${fmt(u.end)}</span></div></header>`
      + img
      + `<div class="frame">`
      + `<div class="t9-landscape-paired">${pairs}</div>`
      + `<div class="t9-portrait-stacked"><div class="bi"><section class="pane en-pane">${en}</section><section class="pane vi-pane">${vi}</section></div></div>`
      + `</div></section>`;
  }

  /* Make the structural renderer authoritative. */
  studyUnit2=studyUnitV37;
  renderStudy=function(){
    const arr=getStudyUnits();
    if(part!=='all') page=Math.min(page,Math.max(0,arr.length-1));
    const show=part==='all'?arr:[arr[page]].filter(Boolean);
    content.innerHTML=show.map(u=>studyUnitV37(u,UNITS.indexOf(u))).join('');
    $('#pagerPrev').classList.toggle('hidden',part==='all');
    $('#pagerNext').classList.toggle('hidden',part==='all');
    restoreEdits();
  };

  render();
})();
</script>
